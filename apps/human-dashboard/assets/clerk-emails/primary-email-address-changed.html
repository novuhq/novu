    <re-main width="560px" background-color="#FFFFFF" border="1px solid #E7E2DA" border-radius="16px">
      <re-block align="left" padding="40px 40px 40px 40px" background-color="#FFFFFF" border-radius="16px">

    </re-footer>
  </re-body>

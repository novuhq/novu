    GenerateChatOAuthUrlResponseDto:
      type: object
      properties:
        url:
          type: string
          description: >-
            The OAuth authorization URL for the chat provider. For Slack: https://slack.com/oauth/v2/authorize?... For
            MS Teams: https://login.microsoftonline.com/.../adminconsent?... This URL should be presented to the user to
            authorize the integration. Expires after 5 minutes.
          example: https://slack.com/oauth/v2/authorize?state=...
      required:
        - url
    GenerateConnectOauthUrlRequestDto:
      type: object
      properties:
        subscriberId:
          type: string
          description: >-
            The subscriber ID to associate with the channel connection. For Slack: optional for workspace connections
            (required only for incoming-webhook scope). For Webex: optional for workspace connections. For MS Teams:
            optional. Admin consent is tenant-wide.
          example: subscriber-123
        integrationIdentifier:
          type: string
          description: Integration identifier
        connectionIdentifier:
          type: string
          description: Identifier of the channel connection that will be created. Generated automatically if not provided.
          example: slack-connection-abc123
        context:
          type: object
          additionalProperties:
            oneOf:
              - type: string
                description: Simple context id
                example: org-acme
              - type: object
                description: Rich context object with id and optional data
                properties:
                  id:
                    type: string
                    example: org-acme
                  data:
                    type: object
                    description: Optional additional context data
                    additionalProperties: true
                    example:
                      name: Acme Corp
                      region: us-east-1
                required:
                  - id
        contextHash:
          type: string
          description: >-
            HMAC-SHA256 of the canonicalized `context`, signed with the tenant environment secret key (the same "Inbox
            with context" signing scheme). Required when the integration has HMAC validation enabled and the session did
            not already HMAC-verify the context. Establishes that the context/tenant binding was minted by an
            authenticated backend rather than forged in the browser.
          example: a1b2c3d4e5f6...
        scope:
          description: >-
            **Slack only**: OAuth scopes to request during authorization. If not specified, default scopes will be used:
            chat:write, chat:write.public, channels:read, groups:read, users:read, users:read.email. **Webex**: OAuth
            scopes to request during authorization. Defaults to: spark:messages_write, spark:rooms_read,
            spark:people_read, spark:memberships_read, spark:kms. **MS Teams**: ignored — uses admin consent with
            pre-configured Azure AD permissions.
          example:
            - chat:write
            - chat:write.public
            - channels:read
          type: array
          items:
            type: string
        connectionMode:
          enum:
            - subscriber
            - shared
          type: string
          description: >-
            Connection mode that determines how the channel connection is scoped. "subscriber" (default) associates the
            connection with a specific subscriber. "shared" associates the connection with a context instead of a
            subscriber.
          example: shared
        autoLinkUser:
          type: boolean
          description: >-
            When true (default when connectionMode is "subscriber"), after the workspace/tenant connection is created
            the OAuth flow also links the subscriber who clicked "Connect" as a personal endpoint. For Slack, uses the
            authed_user.id returned by oauth.v2.access — no extra redirect. For Webex, uses the authenticated Webex
            person returned by people/me — no extra redirect. For MS Teams, triggers a second OAuth redirect for
            delegated user-identity consent. Set to false to only create the workspace connection without linking the
            individual user.
          example: true
      required:
        - integrationIdentifier

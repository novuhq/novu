    LinkChannelEndpointRequestDto:
      type: object
      properties:
        integrationIdentifier:
          type: string
          description: Integration identifier for the chat provider integration
          example: telegram-bot
        subscriberId:
          type: string
          description: External subscriber identifier to link to their chat identity
          example: subscriber-123
        context:
          type: object
          additionalProperties:
            oneOf:
              - type: string
                description: Simple context id
                example: org-acme
              - type: object
                description: Rich context object with id and optional data
                properties:
                  id:
                    type: string
                    example: org-acme
                  data:
                    type: object
                    description: Optional additional context data
                    additionalProperties: true
                    example:
                      name: Acme Corp
                      region: us-east-1
                required:
                  - id
        contextHash:
          type: string
          description: >-
            HMAC-SHA256 of the canonicalized `context`, signed with the tenant environment secret key (the same "Inbox
            with context" signing scheme). Required when the integration has HMAC validation enabled.
          example: a1b2c3d4e5f6...
      required:
        - integrationIdentifier
        - subscriberId
    LinkChannelEndpointResponseDto:
      type: object
      properties:
        url:
          type: string
          description: URL the subscriber opens to link their chat identity (OAuth URL or deep link)
          example: https://t.me/MyBot?start=AbCdEfGhIjKlMnOpQrStUvWxYz012345
        providerMetadata:
          type: object
          additionalProperties: true
          description: Provider-specific metadata returned alongside the link URL
          example:
            botUsername: MyBot
            expiresAt: '2026-06-23T12:00:00.000Z'
      required:
        - url
    ListAgentIntegrationsResponseDto:

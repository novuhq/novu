        - id
        - channel
        - kind
        - people
        - status
        - state
        - from
        - subject
        - preview
        - unreadCount
        - lastMessage
        - isDirectMessage
        - openedAt
        - lastReadAt
        - lastActivityAt
    IntegrationResponseDto:
      type: object
      properties:
        _id:
          type: string
          description: The unique identifier of the integration record in the database. This is automatically generated.
        _environmentId:
          type: string
          description: >-
            The unique identifier for the environment associated with this integration. This links to the Environment
            collection.
        _organizationId:
          type: string
          description: >-
            The unique identifier for the organization that owns this integration. This links to the Organization
            collection.
        name:
          type: string
          description: The name of the integration, which is used to identify it in the user interface.
        identifier:
          type: string
          description: A unique string identifier for the integration, often used for API calls or internal references.
        providerId:
          type: string
          description: The identifier for the provider of the integration (e.g., "mailgun", "twilio").
        channel:
          type: string
          description: >-
            The channel type for the integration, which defines how it communicates (e.g., email, SMS). Not set for
            agent-kind integrations.
          enum:
            - in_app
            - email
            - sms
            - chat
            - push
            - tool
        kind:
          type: string
          description: >-
            Distinguishes delivery integrations from agent-runtime integrations. Defaults to "delivery". Agent
            integrations do not have a channel.
          enum:
            - delivery
            - agent
        credentials:
          description: >-
            The decrypted credentials required for the integration to function (e.g. provider API keys, signing
            secrets). Only returned to dashboard/session-token callers; API-key authenticated callers receive the
            integration metadata without this field to avoid amplifying API-key leaks into provider-credential leaks.
          allOf:
            - $ref: '#/components/schemas/CredentialsDto'
        configurations:
          description: The configurations required for enabling the additional configurations of the integration.
          allOf:
            - $ref: '#/components/schemas/ConfigurationsDto'
        active:
          type: boolean
          description: >-
            Indicates whether the integration is currently active. An active integration will process events and
            messages.
        deleted:
          type: boolean
          description: Indicates whether the integration has been marked as deleted (soft delete).
        deletedAt:
          type: string
          description: The timestamp indicating when the integration was deleted. This is set when the integration is soft deleted.
        deletedBy:
          type: string
          description: The identifier of the user who performed the deletion of this integration. Useful for audit trails.
        primary:
          type: boolean
          description: >-
            Indicates whether this integration is marked as primary. A primary integration is often the default choice
            for processing.
        conditions:
          description: Legacy StepFilter conditions. Ignored when `rules` is also set.
          deprecated: true
          type: array
          items:
            $ref: '#/components/schemas/StepFilterDto'
        rules:
          type: object
          description: JSONLogic used at send time to select this integration. Takes precedence over `conditions`.
          additionalProperties: true
          nullable: true
          example:
            '==':
              - var: context.tenant.id
              - acme
      required:
        - _environmentId
        - _organizationId
        - name
        - identifier
        - providerId
        - active
        - deleted
        - primary
    InteractionResponseDto:
      type: object
      properties:
        id:
          type: string
          description: Public interaction id (`hi_...`).
        kind:
          enum:
            - ask
            - approve
            - choose
            - tell
          type: string
        status:
          enum:
            - pending
            - answered
            - approved
            - denied
            - expired
            - canceled
            - delivered
          type: string
        content:
          type: object
          description: Markdown, chrome, or a posted chat card element.
        from:
          type: string
          description: Attribution label of the calling agent.
        to:
          description: Novu subscriberIds allowed to settle this interaction. First valid answer wins.
          type: array
          items:
            type: string
        integrationIdentifier:
          type: string
        platform:
          type: string
        response:
          type: object
          description: Present once the interaction reached a terminal, answered state.
        failedTo:
          description: >-
            Recipients that did not receive a DM. Present only on create when fan-out was partial; the interaction is
            still live for everyone who did.
          type: array
          items:
            type: string
        threads:
          description: >-
            Present on create: the inbox thread each message landed in. Sending marks the thread read, so `unreadBefore`
            says how many messages in it had not been read.
          type: array
          items:
            $ref: '#/components/schemas/InteractionThreadDto'
        expiresAt:
          type: string
        createdAt:
          type: string
      required:
        - id
        - kind
        - status
        - content
        - to
        - integrationIdentifier
        - platform
        - expiresAt
        - createdAt
    InteractionThreadDto:
      type: object
      properties:
        id:
          type: string
          description: Inbox thread identifier, as `human inbox list` shows it.
        unreadBefore:
          type: number
          description: Messages in the thread that were unread when this was sent.
      required:
        - id
        - unreadBefore
    IssueIntegrationMobileLinkRequestDto:
      type: object

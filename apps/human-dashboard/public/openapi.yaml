components:
  schemas:
    AddAgentIntegrationRequestDto:
      type: object
      properties:
        integrationIdentifier:
          type: string
          description: The integration identifier (same as in the integration store), not the internal document _id.
        providerId:
          type: string
          description: >-
            Provider ID to auto-create a dedicated integration (e.g. novu-agent-email). When set, the server creates the
            integration if one does not already exist for this agent.
    AgentIntegrationResponseDto:
      type: object
      properties:
        _id:
          type: string
          description: Agent–integration link document id.
        _agentId:
          type: string
        integration:
          $ref: '#/components/schemas/AgentIntegrationResponseIntegrationDto'
        _environmentId:
          type: string
        _organizationId:
          type: string
        connectedAt:
          type: object
          nullable: true
          description: Set when the agent–integration link received its first inbound webhook delivery.
        createdAt:
          type: string
        updatedAt:
          type: string
        exceedsPlanLimit:
          type: boolean
          description: >-
            Cloud only. `true` when this channel type (provider) falls outside the organization plan active-channel
            limit (by connection order). Active channels are counted per channel type, so multiple integrations of the
            same provider (e.g. several Slack workspaces) count as a single active channel. Over-limit channels keep
            their configuration but the agent will not respond on them until the plan is upgraded or older channel types
            are disconnected.
        hasChannelEndpoints:
          type: boolean
          description: >-
            `true` when at least one person has linked their chat on this integration (it has a channel endpoint), so
            the agent has someone to reach there. Only returned by the list, and only when true. Email has no channel
            endpoints, so it never carries the flag.
      required:
        - _id
        - _agentId
        - integration
        - _environmentId
        - _organizationId
        - createdAt
        - updatedAt
    AgentIntegrationResponseIntegrationDto:
      type: object
      properties:
        _id:
          type: string
          description: Integration document _id.
        identifier:
          type: string
          description: The integration identifier (matches the integration store), not the internal MongoDB _id.
        name:
          type: string
        providerId:
          type: string
        channel:
          description: Delivery channel; not set for agent-runtime integrations.
          allOf:
            - $ref: '#/components/schemas/ChannelTypeEnum'
        active:
          type: boolean
        sharedInboundAddress:
          type: string
          description: >-
            The Novu shared inbox address for this agent. Set whenever the cloud shared-inbox feature is enabled. The
            dashboard uses this as the headline inbound address and to render the shared inbox row in the inbox list.
        defaultSenderName:
          type: string
          description: >-
            Default email From display name for this agent (NovuAgent integrations only). Falls back to the agent name
            when not explicitly stored on the integration credentials.
        sharedInboxDisabled:
          type: boolean
          description: >-
            When true, the worker drops inbound mail addressed to this agent on the shared `agentconnect.sh` domain.
            Custom-domain routes still deliver. Meaningful on cloud-enabled NovuAgent integrations; on self-hosted it is
            set defensively at provisioning time and is effectively redundant.
      required:
        - _id
        - identifier
        - name
        - providerId
        - active
    BuilderFieldTypeEnum:
      type: string
      enum:
        - BOOLEAN
        - TEXT
        - DATE
        - NUMBER
        - STATEMENT
        - LIST
        - MULTI_LIST
        - GROUP
    ChannelTypeEnum:
      type: string
      enum:
        - in_app
        - email
        - sms
        - chat
        - push
        - tool
    CheckInboxAddressResponseDto:
      type: object
      properties:
        handle:
          type: string
        available:
          type: boolean
        suggestion:
          type: string
        domain:
          type: string
          description: The mailbox domain this deployment publishes, such as `dev.agentinbox.md`.
      required:
        - handle
        - available
        - domain
    CliDeviceSessionPollResponseDto:
      type: object
      properties:
        status:
          enum:
            - pending
            - approved
            - expired
            - denied
          type: string
        expiresIn:
          type: number
        interval:
          type: number
        apiKey:
          type: string
        environmentId:
          type: string
        environmentSlug:
          type: string
          nullable: true
        environmentName:
          type: string
          nullable: true
        organizationId:
          type: string
          nullable: true
        user:
          type: object
          nullable: true
      required:
        - status
    ConfigurationsDto:
      type: object
      properties:
        inboundWebhookEnabled:
          type: boolean
        inboundWebhookSigningKey:
          type: string
        payloadSchema:
          type: string
          description: JSON Schema describing the payload accepted by this integration.
    ConnectHostRequestDto:
      type: object
      properties:
        agent:
          type: string
          maxLength: 320
          description: 'The agent, as `agentinbox connect <agent>` names it: `atlas` or `atlas@…`.'
        code:
          type: string
          maxLength: 32
          description: The one-time code from agentinbox.md, e.g. `BCDF-GHJK`.
      required:
        - agent
        - code
    ConnectHostResponseDto:
      type: object
      properties:
        apiKey:
          type: string
          description: 'The key `agentinbox login` would save: the Development key of the agent’s account.'
        environmentId:
          type: string
        agent:
          type: object
          description: The agent the host acts as from now on.
        host:
          enum:
            - claude-code
            - codex
            - opencode
            - cursor
            - hermes
            - openclaw
            - general
            - claude
            - chatgpt
            - grok
          type: string
          description: >-
            The host this computer counts as: the one the CLI said it runs in, else the one the code was made for, else
            `general`.
      required:
        - apiKey
        - environmentId
        - agent
        - host
    ConstraintValidation:
      type: object
      properties:
        messages:
          type: array
          items:
            type: string
          description: List of validation error messages
          example:
            - Field is required
            - Invalid format
        value:
          description: Value that failed validation
          oneOf:
            - type: string
              nullable: true
            - type: number
            - type: boolean
            - type: object
            - type: array
              items:
                anyOf:
                  - type: string
                    nullable: true
                  - type: number
                  - type: boolean
                  - type: object
                    additionalProperties: true
          example: 'xx xx xx '
      required:
        - messages
    ConsumeSlackSetupLinkRequestDto:
      type: object
      properties:
        token:
          type: string
          description: Signed Slack setup token issued by the connect CLI
        configToken:
          type: string
          description: Slack App Configuration Token (xoxe.xoxp-…) from api.slack.com/apps
      required:
        - token
        - configToken
    ConsumeSlackSetupLinkResponseDto:
      type: object
      properties:
        success:
          type: boolean
        authorizeUrl:
          type: string
          description: Slack OAuth install URL when the setup token was bound to a subscriber. Valid for 5 minutes.
      required:
        - success
    ConsumeTelegramMobileLinkRequestDto:
      type: object
      properties:
        token:
          type: string
          description: Signed Telegram mobile-setup token issued by the dashboard
        botToken:
          type: string
          description: 'Bot token issued by BotFather (format: <id>:<secret>)'
      required:
        - token
        - botToken
    ConsumeTelegramMobileLinkResponseDto:
      type: object
      properties:
        success:
          type: boolean
        botUsername:
          type: string
          description: Telegram bot username (without leading @)
        webhookUrl:
          type: string
          description: Webhook URL Novu registered with Telegram
        deepLinkUrl:
          type: string
          description: >-
            Telegram `t.me/<bot>?start=<code>` deep link to link this chat to the subscriber when the mobile link was
            issued with a subscriberId.
      required:
        - success
        - botUsername
        - webhookUrl
    CreateCliDeviceSessionRequestDto:
      type: object
      properties:
        name:
          type: string
          description: CLI surface identifier (e.g. novu-wizard, novu-connect) for dashboard copy.
        machineName:
          type: string
          maxLength: 255
          description: Name of the computer the CLI runs on, shown on the page that approves the session (human login).
    CreateCliDeviceSessionResponseDto:
      type: object
      properties:
        deviceCode:
          type: string
          description: Opaque device code the CLI polls until authorization completes.
        expiresIn:
          type: number
          description: Seconds until this device session expires.
        interval:
          type: number
          description: Minimum seconds the CLI should wait between poll requests.
        verificationUrl:
          type: string
          description: Page where the session is approved, for CLIs that are not approved on the dashboard (human login).
        userCode:
          type: string
          description: Short code the verification page shows, to compare with the terminal before approving (human login).
      required:
        - deviceCode
        - expiresIn
        - interval
    CreateHumanInviteRequestDto:
      type: object
      properties:
        subscriberId:
          type: string
          maxLength: 128
          description: subscriberId of the human being invited.
        agentIdentifier:
          type: string
          maxLength: 64
          pattern: ^[a-z0-9-_]+$
          description: Relay agent identifier. Defaults to `human-relay`.
        firstName:
          type: string
          maxLength: 128
          description: The human’s first name, shown on the invite page.
        lastName:
          type: string
          maxLength: 128
          description: The human’s last name.
      required:
        - subscriberId
    CreateHumanInviteResponseDto:
      type: object
      properties:
        url:
          type: string
          description: Invite page the human opens to pick how the agent reaches them.
        expiresAt:
          type: string
          description: ISO timestamp when the link stops working.
        channels:
          description: Apps offered on the invite page.
          type: array
          items:
            $ref: '#/components/schemas/HumanInviteChannelDto'
      required:
        - url
        - expiresAt
        - channels
    CreateIntegrationRequestDto:
      type: object
      properties:
        name:
          type: string
          description: The name of the integration
        identifier:
          type: string
          description: The unique identifier for the integration
        _environmentId:
          type: string
          description: The ID of the associated environment
          format: uuid
        providerId:
          type: string
          description: The provider ID for the integration
        channel:
          enum:
            - in_app
            - email
            - sms
            - chat
            - push
            - tool
          type: string
          description: The channel type for the integration. Not required for agent-kind integrations.
        kind:
          enum:
            - delivery
            - agent
          type: string
          description: >-
            Distinguishes delivery integrations from agent-runtime integrations. Defaults to "delivery". Agent
            integrations do not require a channel.
        credentials:
          description: The credentials for the integration
          allOf:
            - $ref: '#/components/schemas/CredentialsDto'
        active:
          type: boolean
          description: If the integration is active, the validation on the credentials field will run
        check:
          type: boolean
          description: Flag to check the integration status
        conditions:
          deprecated: true
          description: Legacy StepFilter conditions. Ignored when `rules` is also set.
          type: array
          items:
            $ref: '#/components/schemas/StepFilterDto'
        rules:
          type: object
          additionalProperties: true
          nullable: true
          description: JSONLogic used at send time to select this integration. Takes precedence over `conditions`.
          example:
            '==':
              - var: context.tenant.id
              - acme
        configurations:
          type: object
          additionalProperties:
            type: string
          description: Configurations for the integration
    CreateInteractionRequestDto:
      type: object
      properties:
        kind:
          enum:
            - ask
            - approve
            - choose
            - tell
          type: string
          description: Interaction verb.
        card:
          description: Kind-specific card. `title` is required. Choose must set `card.options` (2–10).
          allOf:
            - $ref: '#/components/schemas/HumanInteractionCardDto'
        to:
          description: >-
            subscriberId of the contact to reach, an email address, or an array of either. An email address is delivered
            as typed for a claimed organization and does not require confirmation. A contact id on email still requires
            a verified address. Any listed subscriber may settle (first valid answer wins). Without `thread` it starts a
            new thread with each of them; with `thread` only a verified email can choose who may answer, and no contact
            is created. Required unless `thread` is set.
          oneOf:
            - type: string
              example: alice
            - type: array
              items:
                type: string
              example:
                - alice
                - bob
        thread:
          type: string
          maxLength: 100
          description: >-
            Identifier of the inbox thread to send into. The contact the thread belongs to may answer, unless `to` or
            `anyoneMayAnswer` says otherwise. Cannot be combined with `via`.
        anyoneMayAnswer:
          type: boolean
          description: >-
            Let anyone in the thread answer, including people who are not contacts. Needs `thread` and cannot be
            combined with `to`.
        via:
          enum:
            - telegram
            - slack
            - email
          type: string
          description: >-
            Delivery channel preference. Required when the human is reachable on more than one linked channel; otherwise
            the sole linked channel is used.
        agentIdentifier:
          type: string
          description: Identifier of the agent that sends the DM. Defaults to `human-relay`.
        from:
          type: string
          maxLength: 80
          description: Attribution label of the calling agent, rendered in the message.
        ttlSeconds:
          type: number
          minimum: 60
          description: Seconds until the interaction expires. Default 86400 (24h), max 432000.
      required:
        - kind
        - card

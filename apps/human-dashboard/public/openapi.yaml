    InboxThreadDetailsDto:
      type: object
      properties:
        threadId:
          type: string
        channel:
          type: string
        contact:
          nullable: true
          description: The first contact in the thread, or its first stranger when it has no contact.
          type: object
          allOf:
            - $ref: '#/components/schemas/InboxThreadContactDto'
        status:
          type: string
          enum:
            - unread
            - waiting_on_person
            - waiting_on_you
            - open
            - resolved
        openedAt:
          type: string
        lastReadAt:
          type: string
          nullable: true
        agent:
          description: 'The agent whose inbox this is: who "read by" refers to.'

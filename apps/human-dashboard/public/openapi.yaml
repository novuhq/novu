          type: number
      required:
        - threadId
        - channel
        - contact
        - status
        - openedAt
        - lastReadAt
        - agent
        - messageCount
    InboxThreadDto:
      type: object
      properties:
        id:
          type: string
        channel:
          type: string
        kind:
          type: string
          enum:
            - contact
            - stranger
          description: '`contact` once at least one contact is in the thread.'
        people:
          type: array
          items:
            $ref: '#/components/schemas/InboxPersonDto'
        status:
          type: string
          enum:
            - open
            - resolved
        state:
          type: string
          enum:
            - unread
            - waiting_on_person
            - waiting_on_you
            - open
            - resolved
          description: 'Where an open thread stands: unread, waiting on a person, waiting on the agent, open, or resolved.'
        waitingOn:
          description: 'Set while `state` is `waiting_on_person`: who may answer the oldest open question. Empty when anyone may.'
          type: array
          items:
            $ref: '#/components/schemas/InboxPersonDto'
        from:
          type: string
          description: 'Who the thread is with: the names of its people, or their ids where a name is unknown.'
        subject:
          type: string
        preview:
          type: string
          description: The newest message, shortened.
        unreadCount:
          type: number
        lastMessage:
          nullable: true
          type: object
          allOf:
            - $ref: '#/components/schemas/InboxLastMessageDto'
        fromAddress:
          type: string
          description: The address on the other side of an email thread. Missing for chat.
        isDirectMessage:
          type: boolean
        openedAt:
          type: string
        lastReadAt:
          type: string
          nullable: true
          description: When the agent last read the thread, or null if it never did.
        lastActivityAt:
          type: string

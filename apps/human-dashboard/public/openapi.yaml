    RequestAddressVerificationDto:
      type: object
      properties:
        subscriberId:
          type: string
          maxLength: 128
          description: subscriberId of the human being verified.
        via:
          type: string
          enum:
            - email
        address:
          type: string
          format: email
        agentIdentifier:
          type: string
          maxLength: 64
          pattern: ^[a-z0-9-_]+$
          description: Relay agent identifier. Defaults to `human-relay`.
        firstName:
          type: string
          maxLength: 128
        lastName:
          type: string
          maxLength: 128
      required:
        - subscriberId
        - via
        - address
    RequestAddressVerificationResponseDto:
      type: object
      properties:
        address:
          type: string
          description: Masked address the verification was sent to.
        requestedAt:
          type: string
          description: >-
            Identifies this request. Once the link is used, the contact’s email channel reports it as
            `verifiedRequestedAt`.
        expiresAt:
          type: string
        retryAfterSeconds:
          type: number
          description: Seconds until another verification email may be sent.
        replacesVerifiedAddress:
          type: boolean
          description: True when a different address is already verified and stays deliverable until this one is confirmed.
      required:
        - address
        - requestedAt
        - expiresAt
        - retryAfterSeconds
        - replacesVerifiedAddress

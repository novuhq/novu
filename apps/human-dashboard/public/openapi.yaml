  /v1/contacts:
    get:
      operationId: HumanInteractionsController_listContacts
      parameters:
        - name: limit
          required: false
          in: query
          schema:
            minimum: 1
            maximum: 100
            default: 50
            type: number
        - name: after
          required: false
          in: query
          description: Cursor from a previous page’s `next` — returns contacts after it.
          schema:
            type: string
        - name: subscriberId
          required: false
          in: query
          description: Return only the contact with this subscriberId.
          schema:
            maxLength: 255
            type: string
        - name: agentIdentifier
          required: false
          in: query
          description: Relay agent whose channels, defaults and invites are reported. Defaults to `human-relay`.
          schema:
            maxLength: 64
            pattern: ^[a-z0-9-_]+$
            type: string
        - name: Novu-Application-Identifier
          in: header
          required: false
          description: 'Keyless identifier. Send the same value as `Authorization: Keyless <identifier>`.'
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListContactsResponseDto'
      security:
        - ApiKey: []
        - Keyless: []
      summary: List the people an agent can reach
      tags:
        - HumanInteractions

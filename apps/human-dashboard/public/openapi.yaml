  /v1/inbox/{conversationId}:
    get:
      operationId: HumanInboxController_getInboxThread
      parameters:
        - name: conversationId
          required: true
          in: path
          schema:
            type: string
        - name: limit
          required: false
          in: query
          schema:
            minimum: 1
            maximum: 100
            default: 20
            type: number
        - name: before
          required: false
          in: query
          description: Identifier of the oldest message of the previous page.
          schema:
            type: string
        - name: after
          required: false
          in: query
          description: >-
            Identifier of the newest message already read: the page is the messages that came after it, and `hasMore`
            says more came after those. Not together with `before`.
          schema:
            type: string
        - name: include
          required: false
          in: query
          description: '`system` adds the system lines of the thread, such as "resolved", between the messages.'
          schema:
            type: string
            enum:

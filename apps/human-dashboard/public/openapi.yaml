    SetupHumanRelayRequestDto:
      type: object
      properties:
        subscriberId:
          type: string
          maxLength: 128
          description: >-
            subscriberId that identifies the human being set up. Required unless `operator` is set; for the operator it
            is only a suggestion, used when the account has no operator yet.
        operator:
          type: boolean
          description: >-
            Set up the account owner themselves. The response carries the operator’s subscriberId: the one already
            recorded for the relay agent, otherwise the one passed here, otherwise a new one.
        agentIdentifier:
          type: string
          maxLength: 64
          pattern: ^[a-z0-9-_]+$
          description: Relay agent identifier. Defaults to `human-relay`.
        agentName:
          type: string
          description: >-
            What the relay agent is called, as people see it on the invite page, in emails and on its chat bots. Missing
            leaves the name it has; a new agent is called "Human".
          maxLength: 60
        inboxHandle:
          type: string
          pattern: ^[a-z0-9](?:[a-z0-9-]{0,30}[a-z0-9])?$
          description: Mailbox local-part the operator chose, such as `atlas-acme`. Missing means derive one from the agent name.
        agentDescription:
          type: string
          description: A line about what the relay agent does, shown with its name. An empty one clears it.
          maxLength: 512
        email:
          type: string
          format: email
          description: >-
            The operator’s email, stored unverified. It is never a delivery address — only a way to recognize mail they
            send to the agent inbox.
        firstName:
          type: string
          maxLength: 128
          description: The human’s first name (display name shown to agents and in reply attribution).
        lastName:
          type: string
          maxLength: 128
          description: The human’s last name.
        defaultVia:
          enum:
            - telegram
            - slack
            - email
          type: string
          description: >-
            Channel the inviter picked (`human contact invite --via`). Becomes the human’s default unless they already
            chose one themselves.
    SetupHumanRelayResponseDto:
      type: object
      properties:
        agentId:
          type: string
        agentIdentifier:
          type: string
        agentName:
          type: string
          description: What the relay agent is called.
        subscriberId:
          type: string
        emailAddress:
          type: string
          description: The Agent Inbox address, when one was just created.
        emailHandleAdjusted:
          type: boolean
          description: The new mailbox is not the slug of the agent name, because that handle was taken or could not be one.
      required:
        - agentId
        - agentIdentifier
        - agentName
        - subscriberId
    SlackChannelEndpointDto:
      type: object
      properties:
        channelId:
          type: string
          description: Slack channel ID
          example: C123456789
      required:
        - channelId
    SlackQuickSetupRequestDto:
      type: object
      properties:
        configToken:
          type: string
          description: >-
            A Slack App Configuration Token (xoxe.xoxp-... prefix). Used ephemerally to create the Slack app — never
            stored.
          example: xoxe.xoxp-1-...
        agentId:
          type: string
          description: The internal MongoDB `_id` of the agent. Used to build the Slack event webhook URL.
          example: 69f84d848bed9b0a73216d96
        subscriberId:
          type: string
          description: >-
            The subscriber ID to scope the Slack workspace connection to. When provided the resulting channel connection
            is created in "subscriber" mode.
          example: user-123:agent-quickstart:agent-abc
        connectionIdentifier:
          type: string
          description: >-
            A stable identifier for the channel connection that will be created after the OAuth flow completes. Useful
            for idempotent re-installs.
          example: user-123:agent-quickstart:agent-abc
      required:
        - configToken
        - agentId

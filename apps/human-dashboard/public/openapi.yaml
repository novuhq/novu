    ToolWebhookEndpointDto:
      type: object
      properties:
        url:
          type: string
          description: >-
            Destination webhook URL (often a per-subscriber capability URL). Encrypted at rest on the channel endpoint
            (`endpoint` field).
          example: https://example.com/tools/incoming
        headers:
          type: object
          additionalProperties:
            type: string
          description: >-
            Optional headers (e.g. auth tokens) sent with every request to this webhook. Header values are encrypted at
            rest on the channel endpoint (`endpoint` field).
          example:
            Authorization: Bearer <token>
        method:
          enum:
            - POST
            - PUT
            - PATCH
          type: string
          description: Optional HTTP method override for this webhook. Defaults to the integration-level method.
          example: POST
      required:
        - url
    ValidationErrorDto:
      type: object
      properties:
        statusCode:
          type: number
          description: HTTP status code of the error response.
          example: 404
        timestamp:
          type: string
          description: Timestamp of when the error occurred.
          example: '2024-12-12T13:00:00Z'
        path:
          type: string
          description: The path where the error occurred.
          example: /api/v1/resource
        message:
          description: Value that failed validation
          oneOf:
            - type: string
              nullable: true
            - type: number
            - type: boolean
            - type: object
              nullable: true
            - type: array
              items:
                anyOf:
                  - type: string
                    nullable: true
                  - type: number
                  - type: boolean
                  - type: object
                    additionalProperties: true
          example: 'xx xx xx '
        ctx:
          type: object
          description: Optional context object for additional error details.
          additionalProperties: true
          example:
            workflowId: some_wf_id
            stepId: some_wf_id
        errorId:
          type: string
          description: |-
            Optional unique identifier for the error, useful for tracking using Sentry and 
                  New Relic, only available for 500.
          example: abc123
        errors:
          type: object
          description: A record of validation errors keyed by field name
          additionalProperties:
            $ref: '#/components/schemas/ConstraintValidation'
          example:
            fieldName1:
              messages:
                - Field is required
                - Must be a valid email address
              value: invalidEmail
            fieldName2:
              messages:
                - Must be at least 18 years old
              value: 17
            fieldName3:
              messages:
                - Must be a boolean value
              value: true
            fieldName4:
              messages:
                - Must be a valid object
              value:
                key: value
            fieldName5:
              messages:
                - Field is missing
              value: null
            fieldName6:
              messages:
                - Undefined value
      required:
        - statusCode
        - timestamp
        - path
        - errors

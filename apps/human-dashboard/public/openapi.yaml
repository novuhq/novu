        - updatedAt
    HumanContactEmailDto:
      type: object
      properties:
        address:
          type: string
          description: >-
            The address to show: the verified one, otherwise the one waiting for its confirmation link, otherwise one
            known for the contact that was never confirmed (typed during setup, or on the profile).
        status:
          enum:
            - unverified
            - pending
            - verified
          type: string
          description: >-
            `verified`: agents can email `address`. `pending`: a confirmation link was sent and not used yet.
            `unverified`: nobody confirmed it.
        verifiedAt:
          type: string
          description: ISO timestamp when `address` was confirmed. Set when verified.
        pending:
          description: >-
            A confirmation link that is out and not used yet. Next to a verified address it is the new one that replaces
            it once confirmed.
          allOf:

  /v1/inbox:
    get:
      operationId: HumanInboxController_listInboxThreads
      parameters:
        - name: tab
          required: false
          in: query
          description: >-
            One tab of the inbox page, in place of `filter` and `status`: every thread, the unread ones, the ones
            waiting on someone, or the resolved ones.
          schema:
            type: string
            enum:
              - all
              - unread
              - waiting
              - resolved
        - name: channel
          required: false
          in: query
          description: Only threads on this channel, such as `telegram`, `slack` or `email`.
          schema:
            type: string
        - name: search
          required: false
          in: query
          description: Only threads where the subject, a person’s name or a message contains this text.
          schema:
            maxLength: 200
            type: string
        - name: senders
          required: false
          in: query
          description: Threads a contact has written in, or every thread including those from strangers.
          schema:
            default: contacts
            type: string
            enum:
              - contacts
              - all
        - name: agentIdentifier
          required: false
          in: query
          description: Relay agent whose threads to list. Defaults to `human-relay`.
          schema:
            type: string
        - name: filter
          required: false
          in: query
          description: Unread threads, read threads, or both.
          schema:
            default: all
            type: string
            enum:
              - unread
              - read
              - all
        - name: status
          required: false
          in: query
          schema:
            default: open
            type: string
            enum:
              - open
              - resolved
              - all
        - name: limit
          required: false
          in: query
          schema:
            minimum: 1
            maximum: 100
            default: 20
            type: number
        - name: after
          required: false
          in: query
          description: Identifier of the last thread of the previous page.
          schema:
            type: string
        - name: wait
          required: false
          in: query
          description: Hold the request up to this many seconds until a thread matches (max 25).
          schema:
            minimum: 0
            type: number
        - name: agent-inbox-via
          required: false
          in: header
          description: 'Which way a host came in: `cli` or `mcp`. Absent for the dashboard.'
          schema:
            type: string
        - name: agent-inbox-host
          required: false
          in: header
          description: Which host sent the call, such as `claude-code`. Absent when the caller is not a host.
          schema:
            type: string
        - name: Novu-Analytics-Source
          required: false
          in: header
          description: 'Where the call came from: `cli`, `mcp`, or `dashboard`.'
          schema:
            type: string
        - name: Novu-Application-Identifier
          in: header
          required: false
          description: 'Keyless identifier. Send the same value as `Authorization: Keyless <identifier>`.'
          schema:
            type: string
      responses:
        '200':
          description: OK
          headers:
            Content-Type:
              $ref: '#/components/headers/Content-Type'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
            RateLimit-Policy:
              $ref: '#/components/headers/RateLimit-Policy'
            Idempotency-Key:
              $ref: '#/components/headers/Idempotency-Key'
            Idempotency-Replay:
              $ref: '#/components/headers/Idempotency-Replay'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListInboxResponseDto'
      security:
        - ApiKey: []
        - Keyless: []
      summary: List the threads in an inbox
      tags:
        - HumanInbox
  /v1/inbox-address:
    get:
      operationId: HumanInteractionsController_checkInboxAddress
      parameters:
        - name: handle
          required: false
          in: query
          description: The handle to check, such as `atlas`. Omit it to read only the mailbox domain.
          schema:
            pattern: ^[a-z0-9](?:[a-z0-9-]{0,30}[a-z0-9])?$
            type: string
        - name: email
          required: false
          in: query
          description: The operator’s email, used only to suggest a nearby free handle when this one is taken.
          schema:
            format: email
            type: string
        - name: Novu-Application-Identifier
          in: header
          required: false
          description: 'Keyless identifier. Send the same value as `Authorization: Keyless <identifier>`.'
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/CheckInboxAddressResponseDto'
      security:
        - ApiKey: []
        - Keyless: []
      summary: Check whether an inbox address is free
      tags:
        - HumanInteractions

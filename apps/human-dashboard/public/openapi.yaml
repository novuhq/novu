openapi: 3.0.0
info:
  title: Agent Inbox API
  version: 0.1.0
  description: HTTP API for Agent Inbox. The CLI, the MCP server, and https://www.agentinbox.md/api serve these routes.
servers:
  - url: https://www.agentinbox.md/api
paths:
  /v1/agent:
    get:
      operationId: HumanInteractionsController_getAgent
      parameters:
        - name: agentIdentifier
          required: false
          in: query
          description: Relay agent identifier. Defaults to `human-relay`.
          schema:
            maxLength: 64
            pattern: ^[a-z0-9-_]+$
            type: string
        - name: Novu-Application-Identifier
          in: header
          required: false
          description: 'Keyless identifier. Send the same value as `Authorization: Keyless <identifier>`.'
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/HumanAgentResponseDto'
      security:
        - ApiKey: []
        - Keyless: []
      summary: Read the relay agent
      tags:
        - HumanInteractions
  /v1/agent-pictures/{environmentId}/{agentId}/{version}:
    get:
      operationId: HumanAgentPicturesPublicController_getPicture
      parameters:
        - name: environmentId
          required: true
          in: path
          schema:
            type: string
        - name: agentId
          required: true
          in: path
          schema:
            type: string
        - name: version
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: The agent picture.
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
          headers:
            Content-Type:
              $ref: '#/components/headers/Content-Type'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
            RateLimit-Policy:
              $ref: '#/components/headers/RateLimit-Policy'
            Idempotency-Key:
              $ref: '#/components/headers/Idempotency-Key'
            Idempotency-Replay:
              $ref: '#/components/headers/Idempotency-Replay'
      summary: Read an agent picture
      tags:
        - HumanAgentPicturesPublic
      security: []
  /v1/agent/picture:
    put:
      operationId: HumanInteractionsController_setAgentPicture
      parameters:
        - name: agentIdentifier
          required: false
          in: query
          description: Relay agent identifier. Defaults to `human-relay`.
          schema:
            maxLength: 64
            pattern: ^[a-z0-9-_]+$
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - picture
              properties:
                picture:
                  type: string
                  format: binary
                  description: One JPEG or PNG of up to 2 MB.
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/HumanAgentResponseDto'
      security:
        - ApiKey: []
      summary: Set the relay agent picture
      tags:
        - HumanInteractions
  /v1/channels:
    get:
      description: >-
        Retrieve integration links for an agent identified by its external identifier. Supports cursor pagination via
        **after**, **before**, **limit**, **orderBy**, and **orderDirection**.
      operationId: AgentIntegrationsController_listAgentIntegrations
      parameters:
        - name: after
          required: false
          in: query
          description: Cursor for pagination indicating the starting point after which to fetch results.
          schema:
            type: string
        - name: before
          required: false
          in: query
          description: Cursor for pagination indicating the ending point before which to fetch results.
          schema:
            type: string
        - name: limit
          required: false
          in: query
          description: Limit the number of items to return
          schema:
            example: 10
            type: number
        - name: orderDirection
          required: false
          in: query
          description: Direction of sorting
          schema:
            type: string
            enum:
              - ASC
              - DESC
        - name: orderBy
          required: false
          in: query
          description: Field to order by
          schema:
            type: string
        - name: includeCursor
          required: false
          in: query
          description: Include cursor item in response
          schema:
            type: boolean
        - name: integrationIdentifier
          required: false
          in: query
          description: Return only links for this integration identifier (not the internal document _id).
          schema:
            type: string
        - name: agentIdentifier
          required: false
          in: query
          schema:
            type: string
            default: human-relay
          description: Relay agent this call is about. Defaults to `human-relay`.
        - name: Novu-Application-Identifier

# =============================================================================
# ReNovu - Production Overrides for ArokaGO
# =============================================================================
# Use with: docker compose -f docker-compose.yml -f docker-compose.production.yml up -d
#
# Adds:
# - Traefik labels for HTTPS routing
# - Production-ready settings
# - Resource limits
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # Redis - Production Settings
  # ---------------------------------------------------------------------------
  redis:
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  # ---------------------------------------------------------------------------
  # MongoDB - Production Settings
  # ---------------------------------------------------------------------------
  mongodb:
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G

  # ---------------------------------------------------------------------------
  # API - Production with Traefik
  # ---------------------------------------------------------------------------
  api:
    labels:
      - "traefik.enable=true"
      # HTTP to HTTPS redirect
      - "traefik.http.middlewares.renovu-api-https.redirectscheme.scheme=https"
      - "traefik.http.routers.renovu-api-http.rule=Host(`novu-api.arokago.com`)"
      - "traefik.http.routers.renovu-api-http.entrypoints=http"
      - "traefik.http.routers.renovu-api-http.middlewares=renovu-api-https"
      # HTTPS router
      - "traefik.http.routers.renovu-api.rule=Host(`novu-api.arokago.com`)"
      - "traefik.http.routers.renovu-api.entrypoints=https"
      - "traefik.http.routers.renovu-api.tls=true"
      - "traefik.http.routers.renovu-api.tls.certresolver=letsencrypt"
      - "traefik.http.services.renovu-api.loadbalancer.server.port=3001"
      # CORS headers
      - "traefik.http.middlewares.renovu-api-cors.headers.accessControlAllowOriginList=https://www.arokago.com,https://staging.arokago.com"
      - "traefik.http.middlewares.renovu-api-cors.headers.accessControlAllowMethods=GET,POST,PUT,DELETE,OPTIONS"
      - "traefik.http.middlewares.renovu-api-cors.headers.accessControlAllowHeaders=Content-Type,Authorization"
      - "traefik.http.routers.renovu-api.middlewares=renovu-api-cors"
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M
    environment:
      NODE_ENV: production
      API_ROOT_URL: https://novu-api.arokago.com
      FRONT_BASE_URL: https://novu.arokago.com
    ports: []  # Disable direct port exposure in production

  # ---------------------------------------------------------------------------
  # Worker - Production Settings
  # ---------------------------------------------------------------------------
  worker:
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M
    environment:
      NODE_ENV: production

  # ---------------------------------------------------------------------------
  # WebSocket - Production with Traefik
  # ---------------------------------------------------------------------------
  ws:
    labels:
      - "traefik.enable=true"
      # HTTP to HTTPS redirect
      - "traefik.http.middlewares.renovu-ws-https.redirectscheme.scheme=https"
      - "traefik.http.routers.renovu-ws-http.rule=Host(`novu-ws.arokago.com`)"
      - "traefik.http.routers.renovu-ws-http.entrypoints=http"
      - "traefik.http.routers.renovu-ws-http.middlewares=renovu-ws-https"
      # HTTPS router
      - "traefik.http.routers.renovu-ws.rule=Host(`novu-ws.arokago.com`)"
      - "traefik.http.routers.renovu-ws.entrypoints=https"
      - "traefik.http.routers.renovu-ws.tls=true"
      - "traefik.http.routers.renovu-ws.tls.certresolver=letsencrypt"
      - "traefik.http.services.renovu-ws.loadbalancer.server.port=3002"
      # WebSocket headers
      - "traefik.http.middlewares.renovu-ws-headers.headers.customRequestHeaders.X-Forwarded-Proto=https"
      - "traefik.http.routers.renovu-ws.middlewares=renovu-ws-headers"
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    environment:
      NODE_ENV: production
    ports: []  # Disable direct port exposure in production

  # ---------------------------------------------------------------------------
  # Dashboard - Production with Traefik
  # ---------------------------------------------------------------------------
  dashboard:
    labels:
      - "traefik.enable=true"
      # HTTP to HTTPS redirect
      - "traefik.http.middlewares.renovu-dashboard-https.redirectscheme.scheme=https"
      - "traefik.http.routers.renovu-dashboard-http.rule=Host(`novu.arokago.com`)"
      - "traefik.http.routers.renovu-dashboard-http.entrypoints=http"
      - "traefik.http.routers.renovu-dashboard-http.middlewares=renovu-dashboard-https"
      # HTTPS router
      - "traefik.http.routers.renovu-dashboard.rule=Host(`novu.arokago.com`)"
      - "traefik.http.routers.renovu-dashboard.entrypoints=https"
      - "traefik.http.routers.renovu-dashboard.tls=true"
      - "traefik.http.routers.renovu-dashboard.tls.certresolver=letsencrypt"
      - "traefik.http.services.renovu-dashboard.loadbalancer.server.port=4000"
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    environment:
      VITE_API_HOSTNAME: https://novu-api.arokago.com
      VITE_WEBSOCKET_HOSTNAME: https://novu-ws.arokago.com
    ports: []  # Disable direct port exposure in production

# =============================================================================
# Networks - Use Traefik network in production
# =============================================================================
networks:
  renovu-network:
    external: true
    name: traefik-network

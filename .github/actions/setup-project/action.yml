name: Setup Novu Monorepo

description: Sets up the whole monorepo and install dependencies

inputs:
  slim:
    description: 'Should only install dependencies and checkout code'
    required: false
    default: 'false'
  submodules:
    description: 'Should link submodules'
    required: false
    default: 'false'
outputs:
  cypress_cache_hit:
    description: 'Did cypress use binary cache'
    value: ${{ inputs.cypress_version != '' && steps.cache-cypress-binary-version.outputs.cache-hit || steps.cache-cypress-binary.outputs.cache-hit}}

runs:
  using: composite
  steps:
    - name: Install pnpm
      uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
      with:
        version: 11.28.2

    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      name: ⚙️ Setup Node Version
      with:
        node-version: '22.23.5'
        cache: 'pnpm'

    - name: Start Redis, MongoDB and ClickHouse
      if: ${{ inputs.slim == 'false' }}
      shell: bash
      run: |
        docker run -d --name redis -p 6379:6379 redis:latest
        docker run -d --name mongodb -p 27017:27017 mongo:8
        docker run -d --name clickhouse -p 9000:9000 -p 8123:8123 -e CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1 clickhouse/clickhouse-server:24.3-alpine

    - name: 🛟 Install dependencies
      shell: bash
      run: pnpm ci

    # Checked after the install so the services boot while dependencies install.
    - name: Wait for Redis, MongoDB and ClickHouse
      if: ${{ inputs.slim == 'false' }}
      shell: bash
      run: |
        timeout 30 bash -c 'until docker exec redis redis-cli ping; do sleep 1; done'
        timeout 30 bash -c 'until docker exec mongodb mongosh --quiet --eval "db.runCommand({ ping: 1 })"; do sleep 1; done'
        timeout 30 bash -c 'until curl -sf http://127.0.0.1:8123/ping; do sleep 1; done'

    - name: Install wait-on plugin
      shell: bash
      run: pnpm i -g wait-on

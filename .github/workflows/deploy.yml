name: Deploy to Novu Cloud
run-name: >
  Deploying to
  ${{
    github.event.inputs.deploy_api == 'true' && 'api, ' || ''
  }}${{
    github.event.inputs.deploy_worker == 'true' && 'worker, ' || ''
  }}${{
    github.event.inputs.deploy_ws == 'true' && 'ws, ' || ''
  }}${{
    github.event.inputs.deploy_webhook == 'true' && 'webhook, ' || ''
  }}${{
    github.event.inputs.deploy_inbound_mail == 'true' && 'inbound-mail, ' || ''
  }}${{
    github.event.inputs.deploy_thalamus_observer == 'true' && 'thalamus-observer, ' || ''
  }}${{
    github.event.inputs.deploy_socket_worker == 'true' && 'socket-worker, ' || ''
  }}${{
    github.event.inputs.deploy_mcp_server == 'true' && 'mcp-server ' || ''
  }}on ${{ github.event.inputs.environment }}
description: |
  This workflow deploys the Novu Cloud application to different environments and services based on the selected options.
  It builds Docker images, pushes them to Amazon ECR, and deploys them to Amazon ECS.
  `production` deploys every production region: prod-us first, then the other regions once the
  `prod-rollout-approval` environment is approved. A single region (`production-us`, `production-eu`, ...) deploys without approval.
  Optionally deploys the thalamus-observer, socket and MCP server Cloudflare Workers via Wrangler.
  Additionally, it creates Sentry releases and New Relic deployment markers.

env:
  NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}

# One deploy per environment + service combination at a time, so deploys of
# unrelated services don't block each other. Staging cancels the in-flight
# run so only the latest commit deploys; production queues instead of
# cancelling to never interrupt an in-progress production deploy.
concurrency:
  group: >-
    deploy-${{ github.event.inputs.environment }}${{
      github.event.inputs.deploy_api == 'true' && '-api' || ''
    }}${{
      github.event.inputs.deploy_worker == 'true' && '-worker' || ''
    }}${{
      github.event.inputs.deploy_ws == 'true' && '-ws' || ''
    }}${{
      github.event.inputs.deploy_webhook == 'true' && '-webhook' || ''
    }}${{
      github.event.inputs.deploy_inbound_mail == 'true' && '-inbound-mail' || ''
    }}${{
      github.event.inputs.deploy_thalamus_observer == 'true' && '-thalamus-observer' || ''
    }}${{
      github.event.inputs.deploy_socket_worker == 'true' && '-socket-worker' || ''
    }}${{
      github.event.inputs.deploy_mcp_server == 'true' && '-mcp-server' || ''
    }}
  cancel-in-progress: ${{ startsWith(github.event.inputs.environment, 'staging') }}

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy to. production = all regions: US first, the rest after approval"
        required: true
        type: choice
        default: staging
        options:
          - staging
          - staging-sg
          - production
          - production-us
          - production-eu
          - production-sg
          - production-au
          - production-uk
          - production-jp
          - production-kr
      runner:
        description: "Build runner"
        required: true
        type: choice
        default: blacksmith
        options:
          - blacksmith
          - github

      deploy_api:
        description: "Deploy API"
        required: true
        type: boolean
        default: true
      deploy_worker:
        description: "Deploy Worker"
        required: true
        type: boolean
        default: false
      deploy_ws:
        description: "Deploy WS"
        required: true
        type: boolean
        default: false
      deploy_webhook:
        description: "Deploy Webhook (staging, US and EU only)"
        required: true
        type: boolean
        default: false
      deploy_inbound_mail:
        description: "Deploy Inbound Mail (staging, US and EU only)"
        required: true
        type: boolean
        default: false
      deploy_thalamus_observer:
        description: "Deploy thalamus-observer Cloudflare Worker (staging and US only)"
        required: true
        type: boolean
        default: false
      deploy_socket_worker:
        description: "Deploy socket Cloudflare Worker (staging, US and EU only)"
        required: true
        type: boolean
        default: false
      deploy_mcp_server:
        description: "Deploy MCP server Cloudflare Worker (staging, US and EU only)"
        required: true
        type: boolean
        default: false

jobs:
  prepare-matrix:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      wave_1: ${{ steps.plan.outputs.wave_1 }}
      wave_2: ${{ steps.plan.outputs.wave_2 }}
      staged: ${{ steps.plan.outputs.staged }}
      build_environment: ${{ steps.plan.outputs.build_environment }}
      build_services: ${{ steps.plan.outputs.build_services }}
      has_ecs_services: ${{ steps.plan.outputs.has_ecs_services }}
      first_environment: ${{ steps.plan.outputs.first_environment }}
    steps:
      - name: Checkout deploy scripts
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          sparse-checkout: .github/workflows/scripts
          sparse-checkout-cone-mode: false

      # Validates the selection and works out what is deployed where, in which
      # wave. See .github/workflows/scripts/deploy-plan.mjs.
      - name: Plan the deploy
        id: plan
        env:
          WORKER_SERVICE: ${{ vars.WORKER_SERVICE }}
          API_SERVICE: ${{ vars.API_SERVICE }}
          INPUT_ENVIRONMENT: ${{ github.event.inputs.environment }}
          INPUT_DEPLOY_API: ${{ github.event.inputs.deploy_api }}
          INPUT_DEPLOY_WORKER: ${{ github.event.inputs.deploy_worker }}
          INPUT_DEPLOY_WS: ${{ github.event.inputs.deploy_ws }}
          INPUT_DEPLOY_WEBHOOK: ${{ github.event.inputs.deploy_webhook }}
          INPUT_DEPLOY_INBOUND_MAIL: ${{ github.event.inputs.deploy_inbound_mail }}
          INPUT_DEPLOY_THALAMUS_OBSERVER: ${{ github.event.inputs.deploy_thalamus_observer }}
          INPUT_DEPLOY_SOCKET_WORKER: ${{ github.event.inputs.deploy_socket_worker }}
          INPUT_DEPLOY_MCP_SERVER: ${{ github.event.inputs.deploy_mcp_server }}
        run: node .github/workflows/scripts/deploy-plan.mjs

      # An environment without required reviewers lets its job start right away.
      # Refuse to deploy anything if the gate in front of wave 2 is not a gate.
      - name: Check that the approval environment requires reviewers
        if: steps.plan.outputs.staged == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          APPROVAL_ENVIRONMENT: prod-rollout-approval
        run: |
          if ! reviewers=$(gh api "repos/$GITHUB_REPOSITORY/environments/$APPROVAL_ENVIRONMENT" \
            --jq '[.protection_rules[]? | select(.type == "required_reviewers") | .reviewers[]?] | length'); then
            echo "::error::Could not read the $APPROVAL_ENVIRONMENT environment."
            exit 1
          fi

          if [ "${reviewers:-0}" -lt 1 ]; then
            echo "::error::The $APPROVAL_ENVIRONMENT environment has no required reviewers, so the remaining regions would deploy without approval."
            exit 1
          fi

          echo "$APPROVAL_ENVIRONMENT has $reviewers required reviewer(s)."

  # Wave 1: everything for staging or a single region; prod-us only for `production`.
  wave-1:
    name: Wave 1
    needs: prepare-matrix
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/reusable-cloud-deploy.yml
    with:
      wave: ${{ needs.prepare-matrix.outputs.wave_1 }}
      build_environment: ${{ needs.prepare-matrix.outputs.build_environment }}
      build_services: ${{ needs.prepare-matrix.outputs.build_services }}
      runner: ${{ github.event.inputs.runner }}
    secrets: inherit

  # Waits for a reviewer of the `prod-rollout-approval` environment. Approve
  # once prod-us looks healthy; rejecting leaves the other regions untouched.
  approve-remaining-regions:
    name: Approve remaining regions
    needs: [prepare-matrix, wave-1]
    # Results are checked explicitly throughout: the default `success()` also
    # skips a job when something upstream was skipped, and every wave has
    # skipped jobs (services that were not selected).
    if: |
      !cancelled() &&
      needs.prepare-matrix.outputs.staged == 'true' &&
      needs.wave-1.result == 'success'
    runs-on: ubuntu-latest
    environment: prod-rollout-approval
    permissions: {}
    steps:
      - name: Approved
        run: echo "Remaining production regions approved."

  # Wave 2: the other production regions, with the images built in wave 1.
  wave-2:
    name: Wave 2
    needs: [prepare-matrix, wave-1, approve-remaining-regions]
    if: |
      !cancelled() &&
      needs.prepare-matrix.outputs.staged == 'true' &&
      needs.wave-1.result == 'success' &&
      needs.approve-remaining-regions.result == 'success'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/reusable-cloud-deploy.yml
    with:
      wave: ${{ needs.prepare-matrix.outputs.wave_2 }}
      runner: ${{ github.event.inputs.runner }}
    secrets: inherit

  sentry_release:
    needs: [prepare-matrix, wave-1]
    if: |
      !cancelled() &&
      needs.wave-1.result == 'success' &&
      needs.prepare-matrix.outputs.has_ecs_services == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: ${{ fromJson(needs.prepare-matrix.outputs.build_services) }}
    environment: ${{ needs.prepare-matrix.outputs.first_environment }}

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Get NPM Version
        id: package-version
        uses: martinbeentjes/npm-get-version-action@3cf273023a0dda27efcd3164bdfb51908dd46a5b # main
        with:
          path: apps/${{ matrix.service }}

      - name: Create Sentry release
        uses: getsentry/action-release@5657c9e888b4e2cc85f4d29143ea4131fde4a73a # v3.6.0
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ matrix.service }}
        with:
          version: "${{ github.sha }}"
          version_prefix: v
          environment: ${{vars.SENTRY_ENV}}
          ignore_empty: true
          ignore_missing: true

  sync_novu_state:
    needs: [prepare-matrix, wave-1]
    runs-on: ubuntu-latest
    if: |
      !cancelled() &&
      needs.wave-1.result == 'success' &&
      github.event.inputs.deploy_api == 'true'
    environment: ${{ needs.prepare-matrix.outputs.first_environment }}
    steps:
      - name: Sync State to Novu
        uses: novuhq/actions-novu-sync@dceec32b0c93c5d7f741e38094204fd5ebd9f308 # v2
        with:
          secret-key: ${{ secrets.NOVU_INTERNAL_SECRET_KEY }}
          bridge-url: ${{ vars.NOVU_BRIDGE_URL }}

  linear_release_cloud:
    # Cloud uses two continuous Linear pipelines: staging and production.
    # Each successful deploy syncs a completed release to the matching pipeline.
    #
    # The release `name` is date-based (`YYYY-MM-DD HH:MM UTC · <environment>`),
    # so releases are easy to scan in the Linear UI. The commit SHA is preserved
    # on the release via the `version` field (the Linear Release Action has no
    # `description` input — see https://github.com/linear/linear-release-action).
    name: Linear Release (Cloud)
    needs: [prepare-matrix, wave-1, wave-2]
    runs-on: ubuntu-latest
    # Only once every wave has shipped: a `production` rollout that is still
    # waiting for approval, or was rejected, is not a completed release.
    if: |
      always() &&
      needs.prepare-matrix.outputs.has_ecs_services == 'true' &&
      needs.wave-1.result == 'success' &&
      (needs.prepare-matrix.outputs.staged != 'true' || needs.wave-2.result == 'success') &&
      (
        github.event.inputs.environment == 'staging' ||
        github.event.inputs.environment == 'staging-sg' ||
        contains(github.event.inputs.environment, 'production')
      )
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0

      - name: Compute date-based release name
        id: release_meta
        env:
          DEPLOY_ENVIRONMENT: ${{ github.event.inputs.environment }}
        run: |
          release_name="$(date -u +'%Y-%m-%d %H:%M UTC') · ${DEPLOY_ENVIRONMENT}"
          echo "name=${release_name}" >> "$GITHUB_OUTPUT"

      - name: Sync staging release to Linear
        if: |
          github.event.inputs.environment == 'staging' ||
          github.event.inputs.environment == 'staging-sg'
        uses: linear/linear-release-action@0353b5fa8c00326913966f00557d68f8f30b8b6b # pinned v0 ref
        with:
          access_key: ${{ secrets.LINEAR_ACCESS_KEY_CLOUD_STAGING }}
          name: ${{ steps.release_meta.outputs.name }}
          version: ${{ github.sha }}

      - name: Sync production release to Linear
        if: contains(github.event.inputs.environment, 'production')
        uses: linear/linear-release-action@0353b5fa8c00326913966f00557d68f8f30b8b6b # pinned v0 ref
        with:
          access_key: ${{ secrets.LINEAR_ACCESS_KEY_CLOUD_PROD }}
          name: ${{ steps.release_meta.outputs.name }}
          version: ${{ github.sha }}

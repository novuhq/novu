name: Novu Box nightly

on:
  schedule:
    - cron: "17 4 * * *"
  # By hand it does the same. Each run's boxes are base-next-<run id> and nightly-<run id>; the cleanup deletes
  # those of earlier runs once they're an hour idle.
  workflow_dispatch:

permissions: {}

jobs:
  cleanup:
    name: Delete boxes of PRs that are closed or no longer get one, and of earlier runs
    if: github.repository == 'novuhq/novu'
    concurrency:
      group: novu-box-cleanup
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      deployments: write
      id-token: write
      pull-requests: write
    steps:
      - name: Checkout docker/box
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          sparse-checkout: docker/box
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
      - name: Install the box's dependencies
        run: npm ci --prefix docker/box --omit=dev --omit=peer --ignore-scripts --no-fund --no-audit
      - name: Delete the boxes
        run: node docker/box/src/ci/ci.ts cleanup
        env:
          GITHUB_TOKEN: ${{ github.token }}

  rebake:
    name: Bake base again from next
    uses: ./.github/workflows/novu-box-base.yml
    with:
      task: rebake
    permissions:
      contents: read
      id-token: write

  full:
    name: Full TesterArmy suite on a fresh box of next
    needs: rebake
    # Unless the rebake failed: a push to next that replaces the waiting rebake still leaves a good base.
    if: always() && needs.rebake.result != 'failure' && github.repository == 'novuhq/novu'
    concurrency:
      group: novu-box-nightly
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout docker/box
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          sparse-checkout: docker/box
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
      - name: Install the box's dependencies
        run: npm ci --prefix docker/box --omit=dev --omit=peer --ignore-scripts --no-fund --no-audit
      - name: Start box nightly-<run id> from base and the Full groups on it
        run: node docker/box/src/ci/ci.ts full
        env:
          GITHUB_TOKEN: ${{ github.token }}

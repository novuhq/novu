name: Workflow security lint

on:
  pull_request:
    paths:
      - ".github/workflows/**"

jobs:
  workflow-security-lint:
    name: Lint workflows for AWS static keys and shell-injection
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Run security lint
        run: python3 .github/workflows/scripts/check-workflow-security.py

name: Check for .only in Tests

on:
  pull_request:
    branches: [ "**" ]

jobs:
  check-test-only:
    name: Check for .only in Tests
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Install stop-only
        run: npm install -g stop-only
        
      - name: Check for .only in test files
        run: |
          echo "🔍 Checking for .only in test files..."
          echo "This check will fail if any test files contain .only"
          echo "Files being checked:"
          echo "  - *.spec.ts"
          echo "  - *.test.ts"
          echo "  - *.e2e.ts"
          echo "  - *.e2e-ee.ts"
          echo "-------------------------------------------"
          
          # Store the output in a variable
          output=$(find . -type f \( \
            -name "*.spec.ts" -o \
            -name "*.test.ts" -o \
            -name "*.e2e.ts" -o \
            -name "*.e2e-ee.ts" \
          \) -not -path "*/node_modules/*" -not -path "*/dist/*" -exec stop-only --file {} \; 2>&1)
          
          # Check if output contains the error message
          if echo "$output" | grep -q "Found .only"; then
            echo "❌ Found '.only' in test files!"
            echo "-------------------------------------------"
            echo "$output"
            echo "-------------------------------------------"
            echo "⚠️  Please remove all instances of '.only' from your test files"
            exit 1
          else
            echo "✅ No '.only' found in test files"
          fi

name: Check for .only in Tests

on:
  pull_request:
    branches: [ "**" ]

jobs:
  check-test-only:
    name: Check for .only in Tests
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Install stop-only
        run: npm install -g stop-only
        
      - name: Check for .only in test files
        run: |
          # Check all possible test file patterns
          find . -type f \( \
            -name "*.spec.ts" -o \
            -name "*.test.ts" -o \
            -name "*.e2e.ts" -o \
            -name "*.e2e-ee.ts" \
          \) -not -path "*/node_modules/*" -not -path "*/dist/*" -exec stop-only --file {} \;
        
      - name: Comment on PR if .only is found
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '⚠️ This PR contains `.only` in test files. Please remove them before merging.'
            }) 

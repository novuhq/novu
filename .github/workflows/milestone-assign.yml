name: Assign milestone to PR

on:
  pull_request_review:
    types: [submitted]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  assign_milestone:
    if: false
    name: Add milestone
    permissions:
      issues: write
      pull-requests: write
    runs-on: ubuntu-20.04
    steps:
      - uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3

      - uses: actions/setup-node@3235b876344d2a9aa001b8d1453c930bba69e610 # v3
        with:
          node-version: 22.23.4
      - name: Install Octokit
        run: npm --prefix .github/workflows/scripts install @octokit/action

      - name: Assign milestones
        id: check
        run: node .github/workflows/scripts/milestone-assigner.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

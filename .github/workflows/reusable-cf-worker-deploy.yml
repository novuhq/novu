name: Reusable Cloudflare Worker Deploy

on:
  workflow_call:
    inputs:
      worker_directory:
        description: Path from repo root to the worker package
        required: true
        type: string
      wrangler_env:
        description: Wrangler --env name (e.g. staging, production)
        required: true
        type: string
      github_environment:
        description: GitHub Environment that holds CLOUDFLARE_* secrets
        required: true
        type: string

jobs:
  deploy:
    name: Deploy ${{ inputs.worker_directory }} (${{ inputs.wrangler_env }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ inputs.github_environment }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: ${{ inputs.worker_directory }}
        run: npm install

      - name: Deploy with Wrangler
        working-directory: ${{ inputs.worker_directory }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --env "${{ inputs.wrangler_env }}"

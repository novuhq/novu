name: Novu Box

# A Novu Box (docker/box on Cloudflare) per pull request, on demand: a member with write access adds the `box` label
# and the PR gets https://novu-box-pr-<number>.cli-shortener.workers.dev, started from the `base` box; every push
# applies the new head; closing the PR or removing the label deletes it. One PR comment, edited in place, says how
# it went. No secrets: the box host trusts this workflow's OIDC token (docker/box/cloud/auth.mjs), and PRs from
# forks get no box. See docker/box/README.md, "Per pull request".

on:
  pull_request:
    types: [labeled, unlabeled, synchronize, reopened, closed]
  schedule:
    - cron: "17 3 * * *" # nightly: delete boxes whose PR is closed or no longer labeled
    - cron: "17 4 * * 0" # Sundays: bake base again from next
  workflow_dispatch:
    inputs:
      task:
        description: "cleanup: delete boxes whose PR is closed or unlabeled; rebake: bake base again from next"
        type: choice
        options: [cleanup, rebake]

permissions: {}

jobs:
  pr:
    name: Box for this PR
    # The events that concern the box: the `box` label added or removed, or any other event on a PR that has it.
    # A job this skips never joins the concurrency group below, so it can't cancel a box run.
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
      && (github.event.label.name == 'box'
          || (github.event.action != 'labeled' && github.event.action != 'unlabeled'
              && contains(github.event.pull_request.labels.*.name, 'box')))
    # One run per PR at a time; a newer event cancels the older run, and the newer run stops the older apply in the box.
    concurrency:
      group: novu-box-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    # docker/box/ci.mjs ends every wait 5 minutes before this, so it can still say why in the comment.
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    steps:
      - name: Checkout docker/box
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          sparse-checkout: docker/box
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
      - name: Start, update or delete the box
        run: node docker/box/ci.mjs pr
        env:
          GITHUB_TOKEN: ${{ github.token }}

  maintenance:
    name: Clean up PR boxes or rebake base
    if: github.event_name != 'pull_request' && github.repository == 'novuhq/novu'
    concurrency:
      group: novu-box-maintenance
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    steps:
      - name: Checkout docker/box
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          sparse-checkout: docker/box
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
      - name: Run the task
        run: node docker/box/ci.mjs "$TASK"
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TASK: ${{ inputs.task || (github.event.schedule == '17 4 * * 0' && 'rebake' || 'cleanup') }}

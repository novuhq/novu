name: Prepare Self-hosted Release
run-name: Self-hosted release ${{ inputs.version || github.ref_name }} from ${{ inputs.branch || github.ref_name }}

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch, tag or commit SHA to build (defaults to the "Use workflow from" ref)'
        required: false
        type: string
      version:
        description: 'Image version tag to publish, e.g. 0.24.8'
        required: true
        type: string
      services:
        description: 'Comma-separated services to build (api, worker, ws, webhook, inbound-mail, web, widget, embed) or "all"'
        required: false
        type: string
        default: 'all'
      platforms:
        description: 'Target architectures for the images'
        required: false
        type: choice
        default: 'linux/amd64,linux/arm64'
        options:
          - 'linux/amd64,linux/arm64'
          - 'linux/amd64'

permissions:
  contents: write
  packages: write
  deployments: write
  id-token: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      latest-version: ${{ steps.get_version.outputs.latest-version }}
      sha: ${{ steps.get_version.outputs.sha }}
      services: ${{ steps.get_services.outputs.services }}
      platforms: ${{ steps.get_platforms.outputs.platforms }}
    steps:
      - name: Resolve target platforms
        id: get_platforms
        shell: bash
        env:
          INPUT_PLATFORMS: ${{ inputs.platforms }}
        run: |
          PLATFORMS="${INPUT_PLATFORMS:-linux/amd64,linux/arm64}"
          case "$PLATFORMS" in
            linux/amd64|linux/amd64,linux/arm64) ;;
            *)
              echo "::error::Unsupported platforms '$PLATFORMS'. Use linux/amd64 or linux/amd64,linux/arm64"
              exit 1
              ;;
          esac
          echo "platforms=$PLATFORMS" >> $GITHUB_OUTPUT
          echo "Building for platforms: \`$PLATFORMS\`" >> $GITHUB_STEP_SUMMARY
      - name: Resolve services to build
        id: get_services
        shell: bash
        env:
          INPUT_SERVICES: ${{ inputs.services }}
        run: |
          set -f
          ALL_SERVICES="api worker inbound-mail web webhook widget ws embed"
          SELECTED="$(printf '%s' "$INPUT_SERVICES" | tr ',' ' ')"
          if [ -z "${SELECTED// /}" ] || [ "$(printf '%s' "$SELECTED" | tr -d '[:space:]')" == "all" ]
          then
            SELECTED="$ALL_SERVICES"
          fi
          NAMES=()
          for SERVICE in $SELECTED
          do
            SERVICE="${SERVICE#novu/}"
            if [[ " $ALL_SERVICES " != *" $SERVICE "* ]]
            then
              echo "::error::Unknown service '$SERVICE'. Valid services are: ${ALL_SERVICES// /, } or all"
              exit 1
            fi
            NAMES+=("novu/$SERVICE")
          done
          SERVICES_JSON="$(printf '%s\n' "${NAMES[@]}" | jq -R . | jq -cs 'unique')"
          echo "services=$SERVICES_JSON" >> $GITHUB_OUTPUT
          echo "Building services: \`$SERVICES_JSON\`" >> $GITHUB_STEP_SUMMARY
      - name: Resolve ref to build
        id: get_ref
        shell: bash
        env:
          INPUT_BRANCH: ${{ inputs.branch }}
          DEFAULT_REF: ${{ github.ref }}
        run: |
          REF="$(printf '%s' "$INPUT_BRANCH" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
          echo "ref=${REF:-$DEFAULT_REF}" >> $GITHUB_OUTPUT
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ steps.get_ref.outputs.ref }}
      - name: Resolve release version
        id: get_version
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          CURRENT_GIT_TAG: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          LERNA_VERSION="$(jq -r '.version' lerna.json)"
          if [ "$EVENT_NAME" == "workflow_dispatch" ]
          then
            VERSION="$(printf '%s' "$INPUT_VERSION" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
            VERSION="${VERSION#v}"
            if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
            then
              echo "::error::Invalid version '$INPUT_VERSION'. Expected a semantic version such as 0.24.8"
              exit 1
            fi
            if [ "$VERSION" != "$LERNA_VERSION" ]
            then
              echo "::warning::Publishing version $VERSION, but lerna.json on the selected ref is $LERNA_VERSION"
            fi
          elif [ "v$LERNA_VERSION" == "$CURRENT_GIT_TAG" ]
          then
            VERSION="$LERNA_VERSION"
          else
            echo "::error::The version in the file lerna.json does not match the git tag. The version in lerna.json is v$LERNA_VERSION. The git version is $CURRENT_GIT_TAG"
            exit 1
          fi
          SHA="$(git rev-parse HEAD)"
          echo "latest-version=$VERSION" >> $GITHUB_OUTPUT
          echo "sha=$SHA" >> $GITHUB_OUTPUT
          echo "Publishing version \`$VERSION\` from commit \`$SHA\`" >> $GITHUB_STEP_SUMMARY
  build_docker:
    runs-on: ubuntu-latest
    needs: prepare
    timeout-minutes: 240
    environment: Development
    env:
      DOCKER_PLATFORMS: ${{ needs.prepare.outputs.platforms }}
    strategy:
      fail-fast: false
      matrix:
        name: ${{ fromJSON(needs.prepare.outputs.services) }}
    steps:
      - name: Git Checkout with Submodules
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        if: contains(matrix.name, '-ee')
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          submodules: true
          token: ${{ secrets.SUBMODULES_TOKEN }}

      - name: Git Checkout without Submodules
        if: "!contains(matrix.name, '-ee')"
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Variables
        shell: bash
        run: |
          echo "The release version is ${{ needs.prepare.outputs.latest-version }}"
          service=${{ matrix.name }}
          SERVICE_NAME=$(basename "${service//-/-}")
          SERVICE_COMMON_NAME=$(echo "$SERVICE_NAME" | sed 's/-ee$//')
          echo "SERVICE_NAME=$SERVICE_NAME" >> $GITHUB_ENV
          echo "SERVICE_COMMON_NAME=$SERVICE_COMMON_NAME" >> $GITHUB_ENV
          echo "REGISTRY_OWNER=novuhq" >> $GITHUB_ENV
      - name: Install pnpm
        uses: pnpm/action-setup@a3252b78c470c02df07e9d59298aecedc3ccdd6d # v3.0.0

      - name: Use Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20.8.1
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Link submodules
        if: contains(matrix.name, '-ee')
        run: pnpm symlink:submodules

      - uses: ./.github/actions/free-space
      - uses: ./.github/actions/setup-qemu
        with:
          platforms: ${{ needs.prepare.outputs.platforms }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set Bull MQ Env variable for EE
        if: contains(matrix.name, '-ee')
        shell: bash
        run: |
          echo "BULL_MQ_PRO_NPM_TOKEN=${{ secrets.BULL_MQ_PRO_NPM_TOKEN }}" >> $GITHUB_ENV
      - name: Build ${{ env.SERVICE_NAME }} Community Docker Image
        shell: bash
        env:
          DOCKER_BUILD_ARGUMENTS: >
            --cache-from type=registry,ref=ghcr.io/${{ env.REGISTRY_OWNER }}/cache:build-cache-${{ env.SERVICE_NAME }}-community
            --cache-to type=registry,ref=ghcr.io/${{ env.REGISTRY_OWNER }}/cache:build-cache-${{ env.SERVICE_NAME }}-community,mode=max
            --platform=linux/amd64,linux/arm64 --provenance=false
            --output=type=image,name=ghcr.io/${{ env.REGISTRY_OWNER }}/${{ env.SERVICE_NAME }},push-by-digest=true,name-canonical=true
        run: |
          if [ "${{ env.SERVICE_NAME }}" = "embed" ] || [ "${{ env.SERVICE_NAME }}" = "embed-ee" ]; then
            cd libs/$SERVICE_COMMON_NAME
          else
            cd apps/$SERVICE_COMMON_NAME
          fi
          pnpm run docker:build
          docker images
      - name: Check for EE files
        if: "!contains(matrix.name, '-ee')"
        id: check-ee-files
        run: |
          patterns=(
            './node_modules/@novu/ee-**/dist/index.js'
            './node_modules/@taskforcesh/bullmq-pro'  # Add more patterns as needed
          )
          for pattern in "${patterns[@]}"; do
            if docker run --rm novu-$SERVICE_COMMON_NAME sh -c "ls $pattern 2>/dev/null"; then
              echo "::error::'$pattern' files were detected in ${{ matrix.name }}."
              exit 1
            fi
          done
          echo "No matching EE files found in the Docker image ${{ matrix.name }}"
      - name: Tag and Push docker image
        shell: bash
        env:
          IMAGE_NAME: ${{ matrix.name }}
          VERSION: ${{ needs.prepare.outputs.latest-version }}
        run: |
          docker tag novu-$SERVICE_COMMON_NAME ghcr.io/$REGISTRY_OWNER/$IMAGE_NAME:$VERSION
          docker push ghcr.io/$REGISTRY_OWNER/$IMAGE_NAME:$VERSION

name: Check pull request
concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

env:
  NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}

on:
  pull_request:
  workflow_dispatch:

jobs:
  dependency-review:
    name: Dependency review
    runs-on: blacksmith-4vcpu-ubuntu-2404
    environment: Linting
    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: "Dependency Review"
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4

  find-flags:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    name: Find LaunchDarkly feature flags in diff
    # Skip on fork PRs: `LD_ACCESS_TOKEN` is unavailable, so LaunchDarkly's
    # find-code-references action fails with "`access-token` is required".
    # Same `head.repo.fork` gate as pr-labeler.yml.
    if: ${{ github.event.pull_request.head.repo.fork != true }}
    environment: Linting
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Find flags
        uses: launchdarkly/find-code-references-in-pull-request@beb8579e2a1f27acb9aaffdd73682e3733495cbc # v2.3.4
        id: find-flags
        with:
          project-key: default
          environment-key: production
          access-token: ${{ secrets.LD_ACCESS_TOKEN }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}

  lint-changed:
    name: Lint changed files
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Fetch comparison branch
        run: |
          if [[ -n "${{ github.event.pull_request.base.ref }}" ]]; then
            git fetch origin "${{ github.event.pull_request.base.ref }}"
          else
            git fetch origin next
          fi

      - uses: ./.github/actions/setup-project-minimal

      - name: Biome on changed files
        run: |
          if [[ -n "${{ github.event.pull_request.base.ref }}" ]]; then
            since="origin/${{ github.event.pull_request.base.ref }}"
          else
            since="origin/next"
          fi
          pnpm exec biome ci --changed --since="$since" --no-errors-on-unmatched --reporter=github --max-diagnostics=none

  get-affected:
    name: Get Affected Packages
    runs-on: blacksmith-4vcpu-ubuntu-2404
    outputs:
      api-e2e: ${{ steps.plan-jobs.outputs.api-e2e }}
      test-unit: ${{ steps.get-projects-arrays.outputs.test-unit }}
      test-unit-services: ${{ steps.plan-jobs.outputs.test-unit-services }}
      test-unit-apps: ${{ steps.plan-jobs.outputs.test-unit-apps }}
      test-e2e-ee: ${{ steps.get-projects-arrays.outputs.test-e2e-ee }}
      test-cypress: ${{ steps.get-projects-arrays.outputs.test-cypress }}
      test-providers: ${{ steps.get-projects-arrays.outputs.test-providers }}
      test-packages: ${{ steps.get-projects-arrays.outputs.test-packages }}
      test-libs: ${{ steps.get-projects-arrays.outputs.test-libs }}
      typecheck-spec: ${{ steps.get-projects-arrays.outputs.typecheck-spec }}
    permissions:
      contents: read
      pull-requests: read
      packages: write
      deployments: write
      id-token: write
    steps:
      # Get current branch name
      - name: Get branch name
        id: branch-name
        uses: tj-actions/branch-names@e497ceb8ccd43fd9573cf2e375216625bc411d1f # v9.0.0
      # Get base branch name to compare with. Base branch on a PR, "main" branch on pushing.
      - name: Get base branch name
        id: get-base-branch-name
        run: |
          if [[ "${{github.event.pull_request.base.ref}}" != "" ]]; then
            echo "branch=${{github.event.pull_request.base.ref}}" >> $GITHUB_OUTPUT
          else
            echo "branch=main" >> $GITHUB_OUTPUT
          fi
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          # Fetch enough history to find the merge base between base and head
          # This is typically much faster than fetch-depth: 0
          fetch-depth: 50
          # Also fetch the base branch to ensure we have the comparison point
          ref: ${{ github.event.pull_request.head.sha }}

      # Ensure we have the base branch for comparison
      - name: Fetch base branch
        if: github.event.pull_request.base.ref != ''
        run: |
          git fetch origin ${{ github.event.pull_request.base.ref }} --depth=50

      # Classify the PR's changed files for the "Plan test jobs" step below:
      # - docs-only: every file is under docs/ (the Mintlify site).
      # - outside-projects: a file lives outside the folders Nx maps to projects (CI files, scripts,
      #   root config, lockfile, .source, docker...). `nx affected` can't see those changes.
      # When the file list can't be trusted, both are set so the full suite runs.
      - name: Classify changed files
        id: classify-files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          CHANGED_FILES: ${{ github.event.pull_request.changed_files }}
        run: |
          set -uo pipefail
          # Use the GitHub API for the PR file list so detection doesn't depend
          # on the shallow local merge base (the depth-50 fetches above may not
          # reach it, which would make a local `git diff` fail). `--paginate`
          # walks every page so large PRs (>100 files) aren't misclassified as
          # docs-only. Non-PR runs (e.g. workflow_dispatch) have no PR number, so
          # run the full suite.
          if [[ -z "$PR_NUMBER" ]]; then
            echo "docs-only=false" >> "$GITHUB_OUTPUT"
            echo "outside-projects=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The API lists at most 3000 files without flagging truncation, so only
          # trust a list whose length matches changed_files. Renamed files count
          # by both old and new path, and a missing filename is never docs/.
          if ! pr_files=$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" | jq -c 'add // []'); then
            echo "::warning::Could not list the PR's files; running the full suite."
            pr_files='[]'
          fi
          listed=$(echo "$pr_files" | jq 'length')
          files=$(echo "$pr_files" | jq -c 'map(.filename, (.previous_filename // empty))')
          trusted=false
          if [ "$listed" -gt 0 ] && [ "$listed" -lt 3000 ] && [ "$listed" -eq "$CHANGED_FILES" ]; then
            trusted=true
          fi

          all_docs=$(echo "$files" | jq 'all(.[]; type == "string" and startswith("docs/"))')
          # Folders Nx maps to projects, plus folders no build or test reads. `.source` is not here:
          # print-affected-array.mjs maps it to the @novu/ee-* projects only, not to the apps that load them.
          outside_files=$(echo "$files" | jq -r --arg known '^(apps|libs|packages|enterprise|playground|docs|agent-inbox-docs|\.agents|\.cursor)/' \
            '.[] | select(type != "string" or (test($known) | not))')
          outside=false
          if [ -n "$outside_files" ]; then
            outside=true
            echo "Changed files outside Nx projects:"
            sed 's/^/  /' <<< "$outside_files"
          fi
          echo "Listed $listed of $CHANGED_FILES changed files; all under docs/: $all_docs; files outside Nx projects: $outside"

          if [ "$trusted" != true ]; then
            echo "docs-only=false" >> "$GITHUB_OUTPUT"
            echo "outside-projects=true" >> "$GITHUB_OUTPUT"
            echo "The file list is incomplete, so the full suite runs."
          elif [ "$all_docs" = true ]; then
            echo "docs-only=true" >> "$GITHUB_OUTPUT"
            echo "outside-projects=false" >> "$GITHUB_OUTPUT"
            echo "Only docs/ changed — E2E and code tests will be skipped."
          else
            echo "docs-only=false" >> "$GITHUB_OUTPUT"
            echo "outside-projects=$outside" >> "$GITHUB_OUTPUT"
          fi

      - uses: ./.github/actions/setup-project-minimal
      # Configure Nx to be able to detect changes between branches when we are in a PR
      - name: Derive appropriate SHAs for base and head for `nx affected` commands
        uses: nrwl/nx-set-shas@59075b03c42ae79986d96d761eeb15094df7a76e # v2
        with:
          main-branch-name: ${{steps.get-base-branch-name.outputs.branch}}

      - name: Get affected
        id: get-projects-arrays
        # When not in a PR and the current branch is main, pass --all flag. Otherwise pass the base branch.
        # `affected` assigns before it writes, so with pipefail a failing `get-affected` fails this step instead
        # of writing its last log line as the output.
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          CURRENT_BRANCH: ${{ steps.branch-name.outputs.current_branch }}
          BASE_BRANCH: ${{ steps.get-base-branch-name.outputs.branch }}
        run: |
          set -euo pipefail
          affected() {
            local key=$1 value
            shift
            value=$(pnpm run get-affected "$@" | tail -n 1)
            echo "$key=$value" >> "$GITHUB_OUTPUT"
          }

          if [[ -z "$BASE_REF" && "$CURRENT_BRANCH" == "main" ]]; then
            echo "Running ALL"
            since=--all
            unit_target="test:unit"
          else
            echo "Running PR origin/$BASE_BRANCH"
            since="origin/$BASE_BRANCH"
            unit_target="test"
          fi
          affected test-unit "$unit_target" "$since"
          affected test-e2e-ee test:e2e:ee "$since"
          affected test-cypress cypress:run "$since"
          affected test-providers test "$since" providers
          affected test-packages test "$since" packages
          affected test-libs test "$since" libs
          affected typecheck-spec typecheck:spec "$since" all

      # Decide which test jobs start, so a job that has nothing to do never gets a runner.
      # - test-unit-services: @novu/api-service and @novu/worker, one job each (slow suites that need services).
      # - test-unit-apps: every other `test-unit` project, in one job.
      # - api-e2e: false for docs-only PRs. Otherwise true when the API side is affected (@novu/api-service,
      #   @novu/worker or @novu/ee-*; Nx marks api-service affected when any lib or package it builds from
      #   changes) or when a changed file is outside the Nx project folders.
      # A `test-unit` that is not a JSON array fails this step, and with it the PR check: unknown input must
      # never skip tests.
      - name: Plan test jobs
        id: plan-jobs
        env:
          TEST_UNIT: ${{ steps.get-projects-arrays.outputs.test-unit }}
          DOCS_ONLY: ${{ steps.classify-files.outputs.docs-only }}
          OUTSIDE_PROJECTS: ${{ steps.classify-files.outputs.outside-projects }}
        run: |
          set -euo pipefail
          services='["@novu/api-service","@novu/worker"]'

          if ! echo "$TEST_UNIT" | jq -e 'type == "array" and all(.[]; type == "string")' > /dev/null 2>&1; then
            echo "::error::test-unit is not a JSON array of project names: '$TEST_UNIT'"
            exit 1
          fi
          unit=$(echo "$TEST_UNIT" | jq -c '.')
          api_side=$(echo "$unit" | jq --argjson s "$services" 'any(.[]; . as $p | ($s | index($p)) != null or startswith("@novu/ee-"))')

          api_e2e=false
          if [ "$DOCS_ONLY" != true ] && { [ "$api_side" = true ] || [ "$OUTSIDE_PROJECTS" != false ]; }; then
            api_e2e=true
          fi

          {
            echo "test-unit-services=$(echo "$unit" | jq -c --argjson s "$services" 'map(select(. as $p | $s | index($p)))')"
            echo "test-unit-apps=$(echo "$unit" | jq -c --argjson s "$services" 'map(select(. as $p | ($s | index($p)) == null))')"
            echo "api-e2e=$api_e2e"
          } >> "$GITHUB_OUTPUT"
          echo "Docs only: ${DOCS_ONLY:-unknown}; API side affected: $api_side; files outside Nx projects: ${OUTSIDE_PROJECTS:-unknown}; API E2E: $api_e2e"

  test_unit_providers:
    name: Unit test @novu/providers
    runs-on: blacksmith-4vcpu-ubuntu-2404
    needs: [get-affected]
    if: ${{ fromJson(needs.get-affected.outputs.test-providers)[0] }}
    timeout-minutes: 80
    steps:
      - run: echo '${{ needs.get-affected.outputs.test-providers }}'
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: ./.github/actions/setup-project
        with:
          slim: "true"
      - uses: mansagroup/nrwl-nx-action@a531870269e0c1eeb7af6247c4a206c31cae82cc # v3
        env:
          NX_NO_CLOUD: ${{ secrets.NX_CLOUD_ACCESS_TOKEN == '' && 'true' || 'false' }}
        with:
          targets: build,test
          parallel: 5
          projects: ${{join(fromJson(needs.get-affected.outputs.test-providers), ',')}}

  test_unit_packages:
    name: Unit test @novu public NPM packages (except providers)
    runs-on: blacksmith-4vcpu-ubuntu-2404
    needs: [get-affected]
    if: ${{ fromJson(needs.get-affected.outputs.test-packages)[0] }}
    timeout-minutes: 80
    permissions:
      contents: read
      packages: write
      deployments: write
      id-token: write
    steps:
      - name: Affected packages
        run: echo '${{ needs.get-affected.outputs.test-packages }}'

      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - uses: ./.github/actions/setup-project
        with:
          slim: "true"

      # `build` depends on `^build`, so Nx builds each project's own dependencies first.
      - name: Run Lint, Build, Test
        uses: mansagroup/nrwl-nx-action@a531870269e0c1eeb7af6247c4a206c31cae82cc # v3
        env:
          LOG_LEVEL: "info"
          NX_NO_CLOUD: ${{ secrets.NX_CLOUD_ACCESS_TOKEN == '' && 'true' || 'false' }}
        with:
          targets: build,test
          projects: ${{join(fromJson(needs.get-affected.outputs.test-packages), ',')}}

  test_unit_libs:
    name: Unit test @novu internal packages
    runs-on: blacksmith-4vcpu-ubuntu-2404
    needs: [get-affected]
    if: ${{ fromJson(needs.get-affected.outputs.test-libs)[0] }}
    timeout-minutes: 80
    steps:
      - name: Affected libs
        run: echo '${{ needs.get-affected.outputs.test-libs }}'
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - uses: ./.github/actions/setup-project

      - name: Build
        env:
          NX_NO_CLOUD: ${{ secrets.NX_CLOUD_ACCESS_TOKEN == '' && 'true' || 'false' }}
          AFFECTED_LIBS: ${{ join(fromJson(needs.get-affected.outputs.test-libs), ',') }}
        run: npx nx run-many -t build --projects="$AFFECTED_LIBS" --parallel=3

      - name: Test
        env:
          NX_NO_CLOUD: ${{ secrets.NX_CLOUD_ACCESS_TOKEN == '' && 'true' || 'false' }}
          AFFECTED_LIBS: ${{ join(fromJson(needs.get-affected.outputs.test-libs), ',') }}
        run: npx nx run-many -t test --projects="$AFFECTED_LIBS" --parallel=3

  # @novu/api-service and @novu/worker: the two slow suites, one job each.
  test_unit_services:
    name: Unit test backend services
    runs-on: blacksmith-4vcpu-ubuntu-2404
    needs: [get-affected]
    # Fork PRs don't receive SUBMODULES_TOKEN, so the private submodule checkout below can't run for them.
    if: ${{ fromJson(needs.get-affected.outputs.test-unit-services)[0] && github.event.pull_request.head.repo.fork != true }}
    timeout-minutes: 80
    strategy:
      fail-fast: false
      matrix:
        projectName: ${{ fromJson(needs.get-affected.outputs.test-unit-services) }}
    permissions:
      contents: read
      packages: write
      deployments: write
      id-token: write
    steps:
      - run: echo ${{ matrix.projectName }}
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        name: Checkout with submodules
        with:
          submodules: true
          token: ${{ secrets.SUBMODULES_TOKEN }}

      # Both projects need Mongo, Redis and ClickHouse.
      - uses: ./.github/actions/setup-project

      - uses: ./.github/actions/setup-redis-cluster

      # `build` depends on `^build`, so Nx builds the project's own dependencies first
      # (@novu/api for @novu/api-service).
      - name: Build
        env:
          NX_NO_CLOUD: ${{ secrets.NX_CLOUD_ACCESS_TOKEN == '' && 'true' || 'false' }}
          PROJECT_NAME: ${{ matrix.projectName }}
        run: npx nx run-many -t build --projects="$PROJECT_NAME" --parallel=3

      - name: Test
        env:
          NX_NO_CLOUD: ${{ secrets.NX_CLOUD_ACCESS_TOKEN == '' && 'true' || 'false' }}
          PROJECT_NAME: ${{ matrix.projectName }}
        run: npx nx run-many -t test --projects="$PROJECT_NAME" --parallel=3

  # Every other affected project with a `test` target outside providers/, packages/ and libs/
  # (dashboard, ws, inbound-mail, @novu/ee-*, ...). Their tests take seconds, less than one
  # setup, so they share one runner. A build failure in one project stops the tests of all.
  test_unit_apps:
    name: Unit test other apps and enterprise packages
    runs-on: blacksmith-4vcpu-ubuntu-2404
    needs: [get-affected]
    # Fork PRs don't receive SUBMODULES_TOKEN, so the private submodule checkout below can't run for them.
    if: ${{ fromJson(needs.get-affected.outputs.test-unit-apps)[0] && github.event.pull_request.head.repo.fork != true }}
    timeout-minutes: 80
    permissions:
      contents: read
      packages: write
      deployments: write
      id-token: write
    steps:
      - name: Affected projects
        run: echo '${{ needs.get-affected.outputs.test-unit-apps }}'

      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        name: Checkout with submodules
        with:
          submodules: true
          token: ${{ secrets.SUBMODULES_TOKEN }}

      - uses: ./.github/actions/setup-project
        with:
          # Only @novu/ws and @novu/inbound-mail need Mongo, Redis and ClickHouse.
          slim: ${{ !contains(fromJson(needs.get-affected.outputs.test-unit-apps), '@novu/ws') && !contains(fromJson(needs.get-affected.outputs.test-unit-apps), '@novu/inbound-mail') }}

      # Without .source/<package>/node_modules, sources resolved through .source load pnpm's hoisted packages,
      # e.g. a second copy of @langchain/core for @novu/ee-ai.
      - name: Link enterprise packages into .source
        if: ${{ contains(needs.get-affected.outputs.test-unit-apps, '"@novu/ee-') }}
        run: pnpm symlink:submodules

      - uses: ./.github/actions/setup-redis-cluster

      # `build` depends on `^build`, so Nx builds each project's own dependencies first
      # (@novu/api for @novu/dashboard).
      - name: Build
        env:
          NX_NO_CLOUD: ${{ secrets.NX_CLOUD_ACCESS_TOKEN == '' && 'true' || 'false' }}
          AFFECTED_PROJECTS: ${{ join(fromJson(needs.get-affected.outputs.test-unit-apps), ',') }}
        run: npx nx run-many -t build --projects="$AFFECTED_PROJECTS" --parallel=3

      # One project at a time: the suites share one Mongo and one Redis, and @novu/ws drops the
      # `novu-test` database when it finishes.
      - name: Test
        env:
          NX_NO_CLOUD: ${{ secrets.NX_CLOUD_ACCESS_TOKEN == '' && 'true' || 'false' }}
          AFFECTED_PROJECTS: ${{ join(fromJson(needs.get-affected.outputs.test-unit-apps), ',') }}
        run: npx nx run-many -t test --projects="$AFFECTED_PROJECTS" --parallel=1

  # Test runners strip types from test files without checking them. Projects opt in by defining a `typecheck:spec` script.
  typecheck_spec:
    name: Type check tests
    runs-on: blacksmith-4vcpu-ubuntu-2404
    needs: [get-affected]
    # Fork PRs don't receive SUBMODULES_TOKEN, so the private submodule checkout below can't run for them.
    if: ${{ fromJson(needs.get-affected.outputs.typecheck-spec)[0] && github.event.pull_request.head.repo.fork != true }}
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - name: Affected projects
        run: echo '${{ needs.get-affected.outputs.typecheck-spec }}'

      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        name: Checkout with submodules
        with:
          submodules: true
          token: ${{ secrets.SUBMODULES_TOKEN }}

      - uses: ./.github/actions/setup-project
        with:
          slim: "true"

      - name: Build
        env:
          NX_NO_CLOUD: ${{ secrets.NX_CLOUD_ACCESS_TOKEN == '' && 'true' || 'false' }}
          AFFECTED_PROJECTS: ${{ join(fromJson(needs.get-affected.outputs.typecheck-spec), ',') }}
        run: pnpm nx run-many -t build --projects="$AFFECTED_PROJECTS" --parallel=3

      - name: Type check
        env:
          NX_NO_CLOUD: ${{ secrets.NX_CLOUD_ACCESS_TOKEN == '' && 'true' || 'false' }}
          AFFECTED_PROJECTS: ${{ join(fromJson(needs.get-affected.outputs.typecheck-spec), ',') }}
        run: pnpm nx run-many -t typecheck:spec --projects="$AFFECTED_PROJECTS" --parallel=3

  validate_openapi:
    name: Validate OpenAPI
    runs-on: blacksmith-4vcpu-ubuntu-2404
    needs: [get-affected]
    if: ${{ fromJson(needs.get-affected.outputs.test-unit)[0] }}
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
      deployments: write
      id-token: write
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: ./.github/actions/setup-project
      - uses: ./.github/actions/setup-redis-cluster
      - uses: ./.github/actions/run-api
        with:
          launch_darkly_sdk_key: ${{ secrets.LAUNCH_DARKLY_SDK_KEY }}

      - uses: ./.github/actions/validate-openapi

  test_e2e_api:
    name: E2E test API
    needs: [get-affected]
    # Runs when the API side is affected; see the "Plan test jobs" step in get-affected.
    if: ${{ needs.get-affected.outputs.api-e2e == 'true' }}
    uses: ./.github/workflows/reusable-api-e2e.yml
    with:
      # PRs opened from forks (community contributions) do not receive repo
      # secrets — even after a maintainer approves the run — so the EE branch,
      # which checks out the private enterprise submodule using
      # ${{ secrets.SUBMODULES_TOKEN }}, fails immediately with
      # "Input required and not supplied: token". Fall back to the community
      # edition Novu V2 e2e suite for fork PRs so the change still gets validated.
      ee: ${{ github.event.pull_request.head.repo.fork != true }}
    secrets: inherit

  # Aggregator / "all-green" gate. This job depends on every other job in
  # this workflow and reports a single success/failure status that can be
  # used as the one required status check in branch protection (and for
  # GitHub auto-merge). It must always run so that even when a dependency
  # is skipped — e.g. dynamic jobs that have nothing to do because no
  # affected projects were detected — the gate still produces a result.
  #
  # Skipped jobs are treated as success. Failure or cancellation of any
  # required dependency will fail the gate.
  #
  # IMPORTANT: the `needs:` list below must contain every other job in this
  # workflow. The first step in this job parses this very file and fails
  # the run if the list ever drifts (a job is added/removed but `needs:`
  # is not updated). That guard prevents the gate from going falsely green
  # because of a forgotten dependency.
  pr-checks-passed:
    name: PR Checks Passed
    runs-on: ubuntu-latest
    if: ${{ always() }}
    needs:
      - dependency-review
      - find-flags
      - lint-changed
      - get-affected
      - test_unit_providers
      - test_unit_packages
      - test_unit_libs
      - test_unit_services
      - test_unit_apps
      - typecheck_spec
      - validate_openapi
      - test_e2e_api
    steps:
      - name: Checkout workflow source
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          # We only need the workflow file itself to validate the needs list.
          fetch-depth: 1
          sparse-checkout: |
            .github/workflows/on-pr.yml
          sparse-checkout-cone-mode: false

      - name: Validate aggregator `needs` list matches workflow jobs
        # Uses `yq` and `jq`, both pre-installed on GitHub-hosted ubuntu
        # runners — no `pip install` or other dependency setup, so the
        # check runs in well under a second.
        env:
          WORKFLOW: .github/workflows/on-pr.yml
          AGGREGATOR: pr-checks-passed
        run: |
          set -euo pipefail

          workflow_json=$(yq -o=json '.' "$WORKFLOW")

          if ! echo "$workflow_json" | jq -e --arg agg "$AGGREGATOR" '.jobs[$agg]' > /dev/null; then
            echo "::error file=$WORKFLOW::aggregator job '$AGGREGATOR' not found in workflow"
            exit 1
          fi

          diff_json=$(echo "$workflow_json" | jq --arg agg "$AGGREGATOR" '
            .jobs as $jobs
            | ($jobs[$agg].needs // []) as $declared
            | ($jobs | keys | map(select(. != $agg))) as $expected
            | {
                missing: ($expected - $declared),
                extra:   ($declared - $expected),
                total:   ($expected | length)
              }
          ')

          missing=$(echo "$diff_json" | jq -r '.missing | join(", ")')
          extra=$(echo "$diff_json"   | jq -r '.extra   | join(", ")')
          total=$(echo "$diff_json"   | jq -r '.total')

          status=0
          if [ -n "$missing" ]; then
            echo "::error file=$WORKFLOW::$AGGREGATOR.needs is missing jobs that exist in the workflow: $missing. Add them so the gate can't go falsely green."
            status=1
          fi
          if [ -n "$extra" ]; then
            echo "::error file=$WORKFLOW::$AGGREGATOR.needs lists jobs that don't exist in the workflow: $extra. Remove them."
            status=1
          fi

          if [ "$status" -eq 0 ]; then
            echo "$AGGREGATOR.needs correctly covers all $total other jobs in the workflow."
          fi
          exit "$status"

      - name: Verify required jobs succeeded or were skipped
        env:
          NEEDS_JSON: ${{ toJson(needs) }}
        run: |
          set -euo pipefail
          echo "Aggregated job results:"
          echo "$NEEDS_JSON" | jq -r 'to_entries[] | "  - \(.key): \(.value.result)"'

          failed=$(echo "$NEEDS_JSON" | jq -r '[to_entries[] | select(.value.result == "failure" or .value.result == "cancelled") | .key] | join(", ")')

          if [ -n "$failed" ]; then
            echo "::error::The following required jobs failed or were cancelled: $failed"
            exit 1
          fi

          echo "All required jobs passed (or were skipped because they were not affected)."

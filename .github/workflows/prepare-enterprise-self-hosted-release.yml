name: Prepare Enterprise Self-hosted Release
run-name: >
  Building enterprise v${{ github.event.inputs.version }}:
  ${{
    github.event.inputs.build_api == 'true' && 'api, ' || ''
  }}${{
    github.event.inputs.build_worker == 'true' && 'worker, ' || ''
  }}${{
    github.event.inputs.build_dashboard == 'true' && 'dashboard, ' || ''
  }}${{
    github.event.inputs.build_ws == 'true' && 'ws ' || ''
  }}${{
    github.event.inputs.prerelease == 'true' && '(pre-release)' || ''
  }}

env:
  NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 1.0.0)'
        required: true
        type: string
      build_api:
        description: 'Build API service'
        required: true
        type: boolean
        default: true
      build_worker:
        description: 'Build Worker service'
        required: true
        type: boolean
        default: true
      build_dashboard:
        description: 'Build Dashboard service'
        required: true
        type: boolean
        default: true
      build_ws:
        description: 'Build WebSocket service'
        required: true
        type: boolean
        default: true
      prerelease:
        description: 'Is this a pre-release? (if yes, will not be tagged as latest)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  packages: write
  deployments: write
  id-token: write

jobs:
  setup_matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Validate Selected Services
        run: |
          if [ "${{ github.event.inputs.build_api }}" != "true" ] && \
             [ "${{ github.event.inputs.build_worker }}" != "true" ] && \
             [ "${{ github.event.inputs.build_dashboard }}" != "true" ] && \
             [ "${{ github.event.inputs.build_ws }}" != "true" ]; then
            echo "Error: At least one service must be selected for building."
            exit 1
          fi

      - name: Generate Build Matrix
        id: set-matrix
        run: |
          services=()

          if [ "${{ github.event.inputs.build_api }}" == "true" ]; then
            services+=("\"novu/api-ee\"")
          fi
          if [ "${{ github.event.inputs.build_worker }}" == "true" ]; then
            services+=("\"novu/worker-ee\"")
          fi
          if [ "${{ github.event.inputs.build_dashboard }}" == "true" ]; then
            services+=("\"novu/dashboard-ee\"")
          fi
          if [ "${{ github.event.inputs.build_ws }}" == "true" ]; then
            services+=("\"novu/ws-ee\"")
          fi

          matrix="[$(IFS=','; echo "${services[*]}")]"

          echo "matrix=$matrix" >> $GITHUB_OUTPUT
          echo "Building services: $matrix"

  build_docker:
    needs: setup_matrix
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        name: ${{ fromJson(needs.setup_matrix.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0
          token: ${{ secrets.SUBMODULES_TOKEN }}

      - name: Variables
        shell: bash
        run: |
          service=${{ matrix.name }}
          LATEST_VERSION="${{ github.event.inputs.version }}"
          SERVICE_NAME=$(basename "${service//-/-}")
          SERVICE_COMMON_NAME=$(echo "$SERVICE_NAME" | sed 's/-ee$//')
          echo "LATEST_VERSION=$LATEST_VERSION" >> $GITHUB_ENV
          echo "SERVICE_NAME=$SERVICE_NAME" >> $GITHUB_ENV
          echo "SERVICE_COMMON_NAME=$SERVICE_COMMON_NAME" >> $GITHUB_ENV
          echo "REGISTRY_OWNER=novuhq" >> $GITHUB_ENV
          echo "This is the service name: $SERVICE_NAME and release version: $LATEST_VERSION"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.11.0
          run_install: false

      - name: Setup Node Version
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: 'pnpm'

      - name: Install Dependencies
        shell: bash
        run: pnpm install --frozen-lockfile

      - name: Set Up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: 'image=moby/buildkit:v0.13.1'

      - name: Prepare Variables
        run: echo "BULL_MQ_PRO_NPM_TOKEN=${{ secrets.BULL_MQ_PRO_NPM_TOKEN }}" >> $GITHUB_ENV

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build ${{ matrix.name }} Docker Image
        shell: bash
        env:
          DOCKER_BUILD_ARGUMENTS: >
            --platform=linux/amd64
            --output=type=image,name=ghcr.io/$REGISTRY_OWNER/${{ matrix.name }},push-by-digest=true,name-canonical=true
        run: |
          cp scripts/dotenvcreate.mjs apps/$SERVICE_COMMON_NAME/src/dotenvcreate.mjs
          cd apps/$SERVICE_COMMON_NAME

          if [[ "${{ env.SERVICE_COMMON_NAME }}" =~ ^(api|worker|ws)$ ]]; then
            cd src/ && echo -e "\nIS_SELF_HOSTED=true\nNOVU_ENTERPRISE=true" >> .example.env && cd ..
          fi

          # Switch from PM2 cluster mode to single node process to support K8s deployments
          if [[ "${{ env.SERVICE_COMMON_NAME }}" =~ ^(api|worker|ws)$ ]]; then
            echo "Switching ${{ env.SERVICE_COMMON_NAME }} from PM2 cluster mode to single node process to support K8s deployments"
            sed -i.bak 's/pm2-runtime start dist\/main\.js -i max/node dist\/main.js/g' Dockerfile && rm -f Dockerfile.bak
          fi

          pnpm run docker:build
          docker images

      - name: Tag and Push docker image
        shell: bash
        run: |
          # Always tag and push with the specific version
          docker tag novu-$SERVICE_COMMON_NAME ghcr.io/$REGISTRY_OWNER/${{ matrix.name }}:${{ env.LATEST_VERSION }}
          docker push ghcr.io/$REGISTRY_OWNER/${{ matrix.name }}:${{ env.LATEST_VERSION }}

          # Only tag as latest if not marked as pre-release
          if [[ "${{ github.event.inputs.prerelease }}" == "true" ]]; then
            echo "Pre-release flag is set, skipping latest tag"
          else
            echo "Stable release (pre-release flag not set), tagging as latest"
            docker tag novu-$SERVICE_COMMON_NAME ghcr.io/$REGISTRY_OWNER/${{ matrix.name }}:latest
            docker push ghcr.io/$REGISTRY_OWNER/${{ matrix.name }}:latest
          fi

      - name: Output image details
        run: |
          echo "Successfully built and pushed:"
          echo "  - ghcr.io/$REGISTRY_OWNER/${{ matrix.name }}:${{ env.LATEST_VERSION }}"

          if [[ "${{ github.event.inputs.prerelease }}" == "true" ]]; then
            echo "  (latest tag skipped - pre-release flag set)"
          else
            echo "  - ghcr.io/$REGISTRY_OWNER/${{ matrix.name }}:latest"
          fi

          echo "Platform: linux/amd64 (x86)"
          echo "Type: Enterprise Self-hosted"

[project]
name = "novu-playground-fastapi"
version = "0.0.1"
description = "FastAPI playground for the Novu Python agent bridge"
requires-python = ">=3.11"
dependencies = [
  "novu-framework[fastapi]",
  "python-dotenv>=1.0.0",
]

[tool.uv.sources]
novu-framework = { path = "../../packages/framework-py", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

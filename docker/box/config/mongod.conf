storage:
  dbPath: /data/mongo
  wiredTiger:
    engineConfig:
      cacheSizeGB: 0.25
net:
  bindIp: 127.0.0.1
  port: 27017
# Single-member replica set, like Atlas: transactions and the session code paths run for real.
# The oplog grows only as it is written; 990 MB is the minimum cap.
replication:
  replSetName: rs0
  oplogSizeMB: 990
systemLog:
  destination: file
  path: /data/logs/mongod.log
  logAppend: true
  quiet: true
operationProfiling:
  mode: "off"

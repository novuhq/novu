# One node of the box's 3-master Redis Cluster. Cloud runs BullMQ on MemoryDB and the cache on
# ElastiCache, both cluster mode over TLS, so the box does the same. Each node gets its port and
# directory on the command line: redis-server redis.conf --tls-port 7000 --dir /data/redis/7000
bind 127.0.0.1
protected-mode yes
daemonize no
port 0
tls-cert-file /data/redis/tls/redis.crt
tls-key-file /data/redis/tls/redis.key
tls-ca-cert-file /data/redis/tls/ca.crt
tls-auth-clients no
tls-cluster yes
tls-replication yes
cluster-enabled yes
cluster-config-file nodes.conf
cluster-node-timeout 5000
dbfilename dump.rdb
save 300 100
appendonly no
# BullMQ needs noeviction: an evicted job key is a lost notification.
maxmemory 256mb
maxmemory-policy noeviction
logfile ""

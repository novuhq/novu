        <text x="292" y="818" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Decision</text>

        <rect x="352" y="808" width="24" height="12" rx="2" fill="#bf4520" stroke="#bf4520" stroke-width="1" fill-opacity="0.08"/>
        <text x="384" y="818" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Focal</text>

        <line x1="440" y1="814" x2="468" y2="814" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#d-03-a-request-reaches-a-box-box-lifecycle-arrow)"/>
        <text x="476" y="818" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Branch</text>
      </svg>

        <rect x="416" y="244" width="40" height="12" rx="2" fill="#f5f5f5"/>
        <text x="436" y="253" fill="#bf4520" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">HTTPS</text>


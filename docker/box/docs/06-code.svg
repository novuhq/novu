<?xml version="1.0" encoding="UTF-8"?>
<svg style="min-width: 1280px" viewBox="0 0 1280 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="code-and-commands-title code-and-commands-desc" id="d-06-code-root">
        <title id="code-and-commands-title">Novu Box · Which code runs where</title>
        <desc id="code-and-commands-desc">The cli and ci folders run on a laptop or CI runner, cloud and cloud/slack run on Cloudflare Workers, and box runs in the container; a command goes from cli (which ci reuses) over HTTPS to cloud, which execs box/main.ts in the container, while node is shared by the two Node runtimes and shared by all three.</desc>
        <defs>
      <style>#d-06-code-root { --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #d-06-code-root { font-family: var(--font-sans); color: var(--color-ink); }
      #d-06-code-root .diagram-container { width: 100%; overflow-x: auto; }
      #d-06-code-root .subtitle { font-size: 0.95rem;
      line-height: 1.5;
      color: var(--color-muted);
      max-width: 78ch;
      margin-bottom: 1.5rem; }
      #d-06-code-root .diagram-container { overflow-x: visible; }
      #d-06-code-root .diagram-container { overflow-x: visible; }
      #d-06-code-root nav { margin: 0 0 3rem; display: flex; flex-wrap: wrap; gap: 0.4rem 1.25rem; font-family: var(--font-mono); font-size: 0.72rem; letter-spacing: 0.06em; }
      #d-06-code-root nav a { color: var(--color-muted); text-decoration: none; border-bottom: 1px solid rgba(45,49,66,0.2); }
      #d-06-code-root nav a:hover { color: var(--color-accent); border-color: var(--color-accent); }
      #d-06-code-root section { padding: 3rem 0 4rem; border-top: 1px solid rgba(45,49,66,0.12); }
      #d-06-code-root section:first-of-type { border-top: 0; padding-top: 0; }</style>
          <marker id="d-06-code-code-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="d-06-code-code-arrow-both" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="d-06-code-code-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
        </defs>


        <text x="640" y="290" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">hub + Box DO</text>

        <!-- image/Dockerfile -->
        <rect x="928" y="112" width="240" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="928" y="112" width="240" height="64" rx="6" fill="#2d3142" stroke="#2d3142" stroke-width="1" stroke-dasharray="4,3" fill-opacity="0.02" stroke-opacity="0.45"/>

        <rect x="448" y="80" width="384" height="264" rx="8" fill="#2d3142" stroke="#2d3142" stroke-width="1" fill-opacity="0.02" stroke-opacity="0.30"/>
        <rect x="460" y="72" width="144" height="16" fill="#f5f5f5"/>
        <text x="468" y="84" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">CLOUDFLARE WORKERS</text>


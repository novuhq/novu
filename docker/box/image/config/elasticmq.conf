# SQS for the box. Staging and production run QUEUE_BACKEND=sqs on AWS SQS; ElasticMQ speaks the same API.
# Queue settings follow cloud-infra terraform/novu/aws (var.tf): visibility 300s, 3 receives before the DLQ.
# Not emulated: SQS fair queues (MessageGroupId is stored but not used for fairness), duplicate or
# out-of-order delivery, throttling, message retention, and EventBridge Scheduler for delays over 900s
# (QUEUE_BACKEND=sqs_bullmq sends those to BullMQ instead).
include classpath("application.conf")

node-address {
  protocol = http
  host = 127.0.0.1
  port = 9324
  context-path = ""
}

rest-sqs {
  enabled = true
  bind-port = 9324
  bind-hostname = "127.0.0.1"
  sqs-limits = strict
}

rest-stats {
  enabled = false
}

aws {
  region = eu-west-2
  accountId = 000000000000
}

# Messages survive a restart or snapshot, like on SQS: a delayed job must still fire afterwards.
messages-storage {
  enabled = true
  uri = "jdbc:h2:/data/sqs/elasticmq"
}

queues {
  novu-standard-dlq {}
  novu-workflow-dlq {}
  novu-process-subscriber-dlq {}
  novu-web-sockets-dlq {}
  novu-inbound-parse-mail-dlq {}

  novu-standard {
    defaultVisibilityTimeout = 300 seconds
    deadLettersQueue { name = "novu-standard-dlq", maxReceiveCount = 3 }
  }
  novu-workflow {
    defaultVisibilityTimeout = 300 seconds
    deadLettersQueue { name = "novu-workflow-dlq", maxReceiveCount = 3 }
  }
  novu-process-subscriber {
    defaultVisibilityTimeout = 300 seconds
    deadLettersQueue { name = "novu-process-subscriber-dlq", maxReceiveCount = 3 }
  }
  novu-web-sockets {
    defaultVisibilityTimeout = 300 seconds
    deadLettersQueue { name = "novu-web-sockets-dlq", maxReceiveCount = 3 }
  }
  novu-inbound-parse-mail {
    defaultVisibilityTimeout = 300 seconds
    deadLettersQueue { name = "novu-inbound-parse-mail-dlq", maxReceiveCount = 3 }
  }
}

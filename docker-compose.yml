# =============================================================================
# ReNovu - Self-Hosted Notification Platform
# =============================================================================
# Standalone self-hosted deployment with all enterprise features unlocked.
# All ports and URLs are configurable via environment variables.
#
# Usage:
#   docker compose up -d
#
# Default Access:
#   Dashboard: http://localhost:${DASHBOARD_PORT:-4000}
#   API:       http://localhost:${API_PORT:-3001}
#   WebSocket: http://localhost:${WS_PORT:-3002}
#
# Environment Variables (override in .env file):
#   API_PORT, WS_PORT, DASHBOARD_PORT - External ports
#   API_EXTERNAL_URL, WS_EXTERNAL_URL, DASHBOARD_EXTERNAL_URL - Browser URLs
#   MONGO_USER, MONGO_PASSWORD - MongoDB credentials
#   REDIS_PASSWORD - Redis password
#   JWT_SECRET, STORE_ENCRYPTION_KEY, NOVU_SECRET_KEY - Security keys
# =============================================================================

name: renovu

services:
  # ---------------------------------------------------------------------------
  # Infrastructure - Redis
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: ${REDIS_CONTAINER_NAME:-renovu-redis}
    restart: unless-stopped
    command: redis-server ${REDIS_PASSWORD:+--requirepass $REDIS_PASSWORD}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    networks:
      - renovu-network
    healthcheck:
      test: ["CMD", "redis-cli", ${REDIS_PASSWORD:+-a $REDIS_PASSWORD}, "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # ---------------------------------------------------------------------------
  # Infrastructure - MongoDB
  # ---------------------------------------------------------------------------
  mongodb:
    image: mongo:8.0
    container_name: ${MONGO_CONTAINER_NAME:-renovu-mongodb}
    restart: unless-stopped
    ports:
      - "${MONGO_PORT:-27017}:27017"
    environment:
      PUID: 1000
      PGID: 1000
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-renovu}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-renovu-dev-password}
    volumes:
      - mongodb-data:/data/db
    networks:
      - renovu-network
    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--quiet",
          "--username",
          "${MONGO_USER:-renovu}",
          "--password",
          "${MONGO_PASSWORD:-renovu-dev-password}",
          "--eval",
          "db.adminCommand('ping').ok",
        ]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # ---------------------------------------------------------------------------
  # API Server (Built from source)
  # ---------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    image: ${API_IMAGE:-renovu/api:latest}
    container_name: ${API_CONTAINER_NAME:-renovu-api}
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # Core Configuration
      NODE_ENV: ${NODE_ENV:-local}
      PORT: ${API_INTERNAL_PORT:-3001}
      # IMPORTANT: API_ROOT_URL must be external (browser-accessible) URL
      API_ROOT_URL: ${API_EXTERNAL_URL:-http://localhost:${API_PORT:-3001}}
      FRONT_BASE_URL: ${DASHBOARD_EXTERNAL_URL:-http://localhost:${DASHBOARD_PORT:-4000}}

      # Database
      MONGO_URL: mongodb://${MONGO_USER:-renovu}:${MONGO_PASSWORD:-renovu-dev-password}@${MONGO_HOST:-mongodb}:${MONGO_INTERNAL_PORT:-27017}/renovu-db?authSource=admin
      MONGO_MIN_POOL_SIZE: ${MONGO_MIN_POOL_SIZE:-5}
      MONGO_MAX_POOL_SIZE: ${MONGO_MAX_POOL_SIZE:-10}
      MONGO_AUTO_CREATE_INDEXES: ${MONGO_AUTO_CREATE_INDEXES:-true}

      # Redis
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_INTERNAL_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-renovu-redis-dev}
      REDIS_DB_INDEX: ${REDIS_DB_INDEX:-2}
      REDIS_CACHE_SERVICE_HOST: ${REDIS_HOST:-redis}
      REDIS_CACHE_SERVICE_PORT: ${REDIS_INTERNAL_PORT:-6379}
      REDIS_CACHE_PASSWORD: ${REDIS_PASSWORD:-renovu-redis-dev}

      # Security - CHANGE IN PRODUCTION
      JWT_SECRET: ${JWT_SECRET:-renovu-jwt-secret-change-in-production}
      STORE_ENCRYPTION_KEY: ${STORE_ENCRYPTION_KEY:-renovu-32char-encryption-key!!!!}
      NOVU_SECRET_KEY: ${NOVU_SECRET_KEY:-renovu-secret-key-change-in-prod}
      SUBSCRIBER_WIDGET_JWT_EXPIRATION_TIME: ${SUBSCRIBER_WIDGET_JWT_EXPIRATION_TIME:-15d}

      # S3/Storage (optional)
      S3_LOCAL_STACK: ${S3_LOCAL_STACK:-}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-renovu-local}
      S3_REGION: ${S3_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}

      # Self-Hosted Mode - Unlocks all features
      IS_SELF_HOSTED: "true"
      IS_API_IDEMPOTENCY_ENABLED: ${IS_API_IDEMPOTENCY_ENABLED:-false}
      IS_API_RATE_LIMITING_ENABLED: ${IS_API_RATE_LIMITING_ENABLED:-false}
      IS_NEW_MESSAGES_API_RESPONSE_ENABLED: ${IS_NEW_MESSAGES_API_RESPONSE_ENABLED:-true}
      IS_V2_ENABLED: ${IS_V2_ENABLED:-true}

      # Monitoring (optional)
      SENTRY_DSN: ${SENTRY_DSN:-}
      NEW_RELIC_ENABLED: ${NEW_RELIC_ENABLED:-false}
    ports:
      - "${API_PORT:-3001}:${API_INTERNAL_PORT:-3001}"
    networks:
      - renovu-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 --spider http://localhost:${API_INTERNAL_PORT:-3001}/v1/health-check || exit 1",
        ]
      interval: 20s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # ---------------------------------------------------------------------------
  # Worker (Built from source)
  # ---------------------------------------------------------------------------
  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    image: ${WORKER_IMAGE:-renovu/worker:latest}
    container_name: ${WORKER_CONTAINER_NAME:-renovu-worker}
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # Core Configuration
      NODE_ENV: ${NODE_ENV:-local}
      PORT: ${WORKER_INTERNAL_PORT:-3004}
      # Worker uses internal URL to communicate with API (server-to-server)
      API_ROOT_URL: ${API_INTERNAL_URL:-http://api:${API_INTERNAL_PORT:-3001}}

      # Database
      MONGO_URL: mongodb://${MONGO_USER:-renovu}:${MONGO_PASSWORD:-renovu-dev-password}@${MONGO_HOST:-mongodb}:${MONGO_INTERNAL_PORT:-27017}/renovu-db?authSource=admin
      MONGO_MAX_POOL_SIZE: ${MONGO_MAX_POOL_SIZE:-10}

      # Redis
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_INTERNAL_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-renovu-redis-dev}
      REDIS_DB_INDEX: ${REDIS_DB_INDEX:-2}
      REDIS_CACHE_SERVICE_HOST: ${REDIS_HOST:-redis}
      REDIS_CACHE_SERVICE_PORT: ${REDIS_INTERNAL_PORT:-6379}
      REDIS_CACHE_PASSWORD: ${REDIS_PASSWORD:-renovu-redis-dev}

      # Security
      STORE_ENCRYPTION_KEY: ${STORE_ENCRYPTION_KEY:-renovu-32char-encryption-key!!!!}
      SUBSCRIBER_WIDGET_JWT_EXPIRATION_TIME: ${SUBSCRIBER_WIDGET_JWT_EXPIRATION_TIME:-15d}

      # S3/Storage (optional)
      S3_LOCAL_STACK: ${S3_LOCAL_STACK:-}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-renovu-local}
      S3_REGION: ${S3_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}

      # Self-Hosted Mode
      IS_SELF_HOSTED: "true"

      # Worker Settings
      BROADCAST_QUEUE_CHUNK_SIZE: ${BROADCAST_QUEUE_CHUNK_SIZE:-100}
      MULTICAST_QUEUE_CHUNK_SIZE: ${MULTICAST_QUEUE_CHUNK_SIZE:-100}
      IS_EMAIL_INLINE_CSS_DISABLED: ${IS_EMAIL_INLINE_CSS_DISABLED:-false}
      IS_USE_MERGED_DIGEST_ID_ENABLED: ${IS_USE_MERGED_DIGEST_ID_ENABLED:-false}

      # Monitoring (optional)
      SENTRY_DSN: ${SENTRY_DSN:-}
      NEW_RELIC_ENABLED: ${NEW_RELIC_ENABLED:-false}
    networks:
      - renovu-network
    healthcheck:
      # Worker is a background job processor using PM2, check if processes are running
      test: ["CMD-SHELL", "pm2 pid main | grep -q '[0-9]' || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # ---------------------------------------------------------------------------
  # WebSocket Server (Built from source)
  # ---------------------------------------------------------------------------
  ws:
    build:
      context: .
      dockerfile: docker/Dockerfile.ws
    image: ${WS_IMAGE:-renovu/ws:latest}
    container_name: ${WS_CONTAINER_NAME:-renovu-ws}
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # Core Configuration
      NODE_ENV: ${NODE_ENV:-local}
      PORT: ${WS_INTERNAL_PORT:-3002}

      # Database
      MONGO_URL: mongodb://${MONGO_USER:-renovu}:${MONGO_PASSWORD:-renovu-dev-password}@${MONGO_HOST:-mongodb}:${MONGO_INTERNAL_PORT:-27017}/renovu-db?authSource=admin
      MONGO_MAX_POOL_SIZE: ${MONGO_MAX_POOL_SIZE:-10}

      # Redis
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_INTERNAL_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-renovu-redis-dev}

      # Security
      JWT_SECRET: ${JWT_SECRET:-renovu-jwt-secret-change-in-production}

      # Self-Hosted Mode
      IS_SELF_HOSTED: "true"

      # Monitoring (optional)
      NEW_RELIC_ENABLED: ${NEW_RELIC_ENABLED:-false}
    ports:
      - "${WS_PORT:-3002}:${WS_INTERNAL_PORT:-3002}"
    networks:
      - renovu-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 --spider http://localhost:${WS_INTERNAL_PORT:-3002}/v1/health-check || exit 1",
        ]
      interval: 20s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # ---------------------------------------------------------------------------
  # Dashboard (Built from source with self-hosted fixes)
  # ---------------------------------------------------------------------------
  dashboard:
    build:
      context: .
      dockerfile: docker/Dockerfile.dashboard
    image: ${DASHBOARD_IMAGE:-renovu/dashboard:latest}
    container_name: ${DASHBOARD_CONTAINER_NAME:-renovu-dashboard}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      worker:
        condition: service_started
    environment:
      # IMPORTANT: These must be external URLs (browser-accessible)
      VITE_API_HOSTNAME: ${API_EXTERNAL_URL:-http://localhost:${API_PORT:-3001}}
      VITE_SELF_HOSTED: "true"
      VITE_WEBSOCKET_HOSTNAME: ${WS_EXTERNAL_URL:-http://localhost:${WS_PORT:-3002}}
      VITE_LEGACY_DASHBOARD_URL: ""
      VITE_CLERK_PUBLISHABLE_KEY: ""
      VITE_IS_EE: "false"
    ports:
      - "${DASHBOARD_PORT:-4000}:4000"
    networks:
      - renovu-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e "const http = require(''http''); const req = http.get({hostname: ''localhost'', port: 4000, path: ''/'', timeout: 5000}, (res) => { process.exit(res.statusCode === 200 ? 0 : 1); }); req.on(''error'', () => process.exit(1)); req.on(''timeout'', () => { req.destroy(); process.exit(1); });"',
        ]
      interval: 20s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

# =============================================================================
# Networks
# =============================================================================
networks:
  renovu-network:
    driver: bridge

# =============================================================================
# Volumes
# =============================================================================
volumes:
  redis-data:
    driver: local
  mongodb-data:
    driver: local

procs:
  "━━ APPS ━━━━━━━━":
    shell: sleep infinity
    autostart: false
  "  api":
    shell: pnpm --filter @novu/api-service ${API_PORTLESS_SCRIPT:-start:portless}
  "  dashboard":
    shell: pnpm --filter @novu/dashboard start:portless
  "  worker":
    shell: pnpm --filter @novu/worker start:portless
    autostart: false
  "  inbound-mail":
    shell: pnpm --filter @novu/inbound-mail start:dev
    autostart: false

  "━━ LIBS ━━━━━━━━":
    shell: sleep infinity
    autostart: false
  "  dal":
    shell: pnpm --filter @novu/dal start
  "  application-generic":
    shell: pnpm --filter @novu/application-generic start

  "━━ PACKAGES ━━━━":
    shell: sleep infinity
    autostart: false
  "  shared":
    shell: pnpm --filter @novu/shared start
  "  providers":
    shell: pnpm --filter @novu/providers start
    autostart: false
  "  js":
    shell: pnpm --filter @novu/js build:watch
    autostart: false
  "  react":
    shell: pnpm --filter @novu/react build:watch
    autostart: false

  "━━ PLAYGROUND ━━":
    shell: sleep infinity
    autostart: false
  "  nextjs":
    shell: pnpm --filter nextjs start:portless
    autostart: false

  "━━ CONFIG ━━━━━━":
    shell: sleep infinity
    autostart: false
  "  dev config":
    shell: node scripts/novu-dev-config.mjs
    autostart: false

scrollback: 100000
